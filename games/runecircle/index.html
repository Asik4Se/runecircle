<title>ルーンサークル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow phone-first column; the magic circle grid is the centerpiece of every combat screen. Single night palette by design (placeholder art). */
:root{
  --night:#15131f; --panel:#1f1c2e; --stone:#2a2640; --line:#3d3760; --ink:#efe8d8; --muted:#a8a0c0; --gold:#d8b45e;
  --hp:#d9605a; --block:#7cb0e3; --good:#7fcf8c;
  --fire:#ec7a4f; --thunder:#e6c34a; --water:#56a8e6; --forest:#6cc070; --star:#b991ec; --wind:#63d2b5;
  --display:"Kaisei Decol","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background-color:var(--night);
  background-image:radial-gradient(ellipse 80% 50% at 50% -10%, color-mix(in srgb,var(--star) 16%,transparent), transparent 70%);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--body); font-size:14px; line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{max-width:480px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:20px} h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.num{font-variant-numeric:tabular-nums}

.e-fire{--ec:var(--fire)} .e-thunder{--ec:var(--thunder)} .e-water{--ec:var(--water)} .e-forest{--ec:var(--forest)} .e-star{--ec:var(--star)} .e-wind{--ec:var(--wind)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:700;min-height:44px}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#221c10;border-color:var(--gold)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.on{background:color-mix(in srgb,var(--water) 30%,var(--panel));border-color:var(--water)}
.btn:disabled{opacity:.45}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}

.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:11.5px;background:var(--stone);border:1px solid var(--line);white-space:nowrap}
.chip.c-fire{border-color:var(--fire);color:var(--fire)} .chip.c-water{border-color:var(--water);color:var(--water)}
.chip.c-star{border-color:var(--star);color:var(--star)} .chip.c-thunder{border-color:var(--thunder);color:var(--thunder)} .chip.c-block{border-color:var(--block);color:var(--block)}
.chip.c-forest{border-color:var(--forest);color:var(--forest)} .chip.c-hp{border-color:var(--hp);color:var(--hp)}
.chip.relic{border-color:color-mix(in srgb,var(--gold) 60%,transparent);color:var(--gold)}
button.chip{cursor:pointer}

.bar{display:block;height:8px;border-radius:99px;background:var(--stone);overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--hp);transition:width .25s}
.bar.blk>span{background:var(--block)}

/* top status */
.status{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.status .where{font-family:var(--display);font-size:15px}
.status .bar{grid-column:1/-1}
.progress{display:flex;gap:3px}
.progress i{flex:1;height:5px;border-radius:2px;background:var(--stone)}
.progress i.done{background:var(--gold)}
.progress i.now{background:color-mix(in srgb,var(--gold) 50%,var(--stone))}

/* title */
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding-block:24px 8px}
.circle{width:min(62vw,240px);aspect-ratio:1;max-width:100%;position:relative}
.circle i{position:absolute;inset:0;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--gold) 70%,transparent)}
.circle i:nth-child(2){inset:12%;border-style:dashed;border-color:color-mix(in srgb,var(--star) 70%,transparent);animation:spin 40s linear infinite}
.circle i:nth-child(3){inset:26%;border-color:color-mix(in srgb,var(--water) 60%,transparent);animation:spin 26s linear infinite reverse}
.circle i:nth-child(4){inset:38%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 30%,transparent),transparent 70%);border:none}
.circle b{position:absolute;font-family:var(--display);font-size:15px;color:var(--gold);transform:translate(-50%,-50%)}
@keyframes spin{to{transform:rotate(360deg)}}
.hero h1{font-size:34px;letter-spacing:.08em}
.tag{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:10px}

/* character select */
.chars{display:flex;flex-direction:column;gap:10px}
.char{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.char.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.char.locked{opacity:.5}
.char .nm{font-family:var(--display);font-size:17px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .btn{min-width:44px;padding:0}

/* map options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}
.opt:hover{border-color:var(--gold)}
.opt .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:18px;background:var(--stone);border:1.5px solid var(--line)}
.opt.k-elite .ic{border-color:var(--hp);color:var(--hp)} .opt.k-boss .ic{border-color:var(--hp);background:color-mix(in srgb,var(--hp) 25%,var(--stone))}
.opt.k-camp .ic{border-color:var(--forest);color:var(--forest)} .opt.k-shop .ic{border-color:var(--gold);color:var(--gold)}
.opt.k-event .ic{border-color:var(--star);color:var(--star)} .opt.k-treasure .ic{border-color:var(--thunder);color:var(--thunder)}
.opt .nm{font-weight:700;font-size:15px}

/* enemies */
.enemies{display:flex;gap:8px}
.enemy{flex:1;min-width:0;text-align:left;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:5px;transition:opacity .3s}
.enemy.tg{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.enemy.boss{background:color-mix(in srgb,var(--hp) 10%,var(--panel))}
.enemy.dead{opacity:.35}
.ename{font-family:var(--display);font-weight:700;font-size:14px;line-height:1.3}
.intent{align-self:flex-start;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--stone);color:var(--muted)}
.intent.atk{background:color-mix(in srgb,var(--hp) 25%,var(--stone));color:#f4b2ad}
.hpnum{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px}

.player{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.mana{display:flex;gap:5px;align-items:center}
.mana i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--water);display:block}
.mana i.full{background:var(--water);box-shadow:0 0 8px color-mix(in srgb,var(--water) 70%,transparent)}

/* board */
.board{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.board.combat{grid-template-columns:repeat(var(--n),minmax(0,1fr)) 38px}
.cell{position:relative;aspect-ratio:1;max-width:100%;min-width:0;border-radius:10px;padding:4px 2px;
  border:1.5px solid color-mix(in srgb,var(--ec,var(--line)) 60%,transparent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--ec,var(--stone)) 24%,var(--stone)),var(--stone));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .12s,box-shadow .12s}
.cell.none{background:transparent;border-style:dashed;border-color:var(--line)}
.cell .empty{font-size:11px;color:var(--muted)}
.glyph{width:20px;height:20px;border-radius:50%;background:var(--ec);color:#1a1626;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:12px;line-height:1}
.rn{font-size:clamp(9.5px,2.5vw,11.5px);line-height:1.15;text-align:center;overflow-wrap:anywhere;max-width:100%}
.rv{font-size:clamp(11px,3vw,13px);font-weight:700;color:var(--ec);font-variant-numeric:tabular-nums;line-height:1.1}
.rv .g{color:var(--forest);font-size:.85em}
.view-label{color:var(--gold);margin-bottom:-4px}
.rv2{font-size:clamp(9px,2.4vw,11px);line-height:1.1;color:var(--ec);opacity:.85;font-variant-numeric:tabular-nums;text-align:center;max-width:100%;overflow-wrap:anywhere}
.mod{position:absolute;top:2px;right:3px;font-size:9.5px;font-weight:700;padding:0 4px;border-radius:4px;background:var(--gold);color:#221c10}
.seal{position:absolute;inset:0;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,#000 55%,transparent);font-family:var(--display);font-size:22px;color:var(--star)}
.cell.hl{transform:scale(1.06);box-shadow:0 0 0 3px var(--gold),0 0 18px color-mix(in srgb,var(--gold) 60%,transparent);z-index:2}
.cell.sel{box-shadow:0 0 0 3px var(--gold)}
.cell.ng{opacity:.3}
.cell.pv{box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 60%,transparent)}
.cell.corner-glow::after{content:"";position:absolute;inset:-1px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--thunder) 60%,transparent);pointer-events:none}
.line{border-radius:10px;border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--panel));color:var(--gold);font-weight:700;font-size:15px;min-height:38px;display:grid;place-items:center}
.line:hover:not(:disabled){background:color-mix(in srgb,var(--gold) 30%,var(--panel))}
.line:disabled{border-color:var(--line);color:var(--muted);background:transparent;opacity:.6}
.line.used{opacity:.35}

.reserve{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.label{font-size:11.5px;letter-spacing:.08em;color:var(--muted)}

.info{min-height:64px;font-size:13px}
.info .nm{font-family:var(--display);font-weight:700;font-size:15px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:start}
.cmp-col{min-width:0;display:flex;flex-direction:column;gap:4px;font-size:12.5px;line-height:1.5}
.cmp-col:not(.after){color:var(--muted)}
.cmp-col.after{padding:8px;margin:-8px;border-radius:10px;background:color-mix(in srgb,var(--good) 8%,transparent)}
.cmp .arrow{align-self:center;color:var(--gold);font-weight:700;font-size:18px}
.cmp b.up{color:var(--good)}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}

/* reward cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.rcard{text-align:left;padding:12px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--ec,var(--gold)) 55%,transparent);background:linear-gradient(170deg,color-mix(in srgb,var(--ec,var(--gold)) 16%,var(--panel)),var(--panel));display:flex;flex-direction:column;gap:6px;min-width:0}
.rcard:hover:not(:disabled){box-shadow:0 0 0 2px var(--ec,var(--gold))}
.rcard .top{display:flex;align-items:center;gap:8px}
.rcard .nm{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.3}
.rcard .rar{font-size:11px;color:var(--muted)}
.rcard .rar.x{color:var(--hp)}
.rcard .d{font-size:12.5px;line-height:1.55}
.price{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.sold{opacity:.4}

.confirm{border-color:var(--hp)}

.float{position:fixed;pointer-events:none;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;transform:translate(-50%,-50%);animation:rise .9s ease-out forwards;text-shadow:0 1px 3px #000;z-index:50}
.float.mod{color:var(--gold);font-size:13px;white-space:nowrap} .float.dmg{color:#ffb0a6} .float.blk{color:var(--block)} .float.heal{color:var(--good)} .float.grow{color:var(--forest);font-size:13px} .float.info{color:var(--star);font-size:14px} .float.burn{color:var(--fire)} .float.pdmg{color:var(--hp)}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-42px}}
.shake{animation:shake .3s}
.cell.modpulse::before{content:"";position:absolute;inset:-3px;border-radius:12px;border:2px solid var(--gold);box-shadow:0 0 14px color-mix(in srgb,var(--gold) 70%,transparent);animation:modring .65s ease-out forwards;pointer-events:none}
@keyframes modring{from{opacity:1;transform:scale(.92)}to{opacity:0;transform:scale(1.35)}}
.cell.modpulse .mod{animation:modbadge .65s}
@keyframes modbadge{0%{transform:scale(1)}35%{transform:scale(1.7)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:13px;min-height:36px}
.tab.on{border-color:var(--ec,var(--gold));color:var(--ec,var(--gold));box-shadow:0 0 0 1px var(--ec,var(--gold))}
.party{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,118px),1fr));gap:6px}
.pm{padding:7px 9px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:12.5px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow-wrap:anywhere}
.pm.act{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pm.down{opacity:.4}
.banner{text-align:center;font-family:var(--display);font-weight:700;font-size:15px;padding:6px;border-radius:10px;background:var(--stone);color:var(--muted)}
.banner.mine{background:color-mix(in srgb,var(--gold) 22%,var(--stone));color:var(--gold)}
.code{display:block;font-family:var(--display);font-size:30px;letter-spacing:.25em;color:var(--gold)}
.field{box-sizing:border-box;width:100%;max-width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--stone);color:var(--ink);font:inherit;min-height:44px}
.field:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.opt.voted{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.opt:disabled{cursor:default}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.roulette{align-items:center;text-align:center}
.wheelbox{position:relative;width:min(64vw,220px);aspect-ratio:1;max-width:100%}
.wheel{width:100%;height:100%;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 24px color-mix(in srgb,var(--gold) 30%,transparent)}
.pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--ink);z-index:2;filter:drop-shadow(0 1px 2px #000)}
.linkbtn{background:none;border:none;padding:0;color:var(--gold);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,128px),1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--display);font-size:20px;line-height:1.3}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl thead th{color:var(--muted);font-weight:500;font-size:11.5px;letter-spacing:.04em}
.tbl tbody tr:last-child th,.tbl tbody tr:last-child td{border-bottom:none}
.tbl td.num{text-align:right}
.cell.pv{box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 75%,transparent)}
.cell.pv::before{content:attr(data-step);position:absolute;left:4px;top:2px;font-size:10px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.codex .it{padding:8px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:12px;min-width:0}
.codex .it b{font-family:var(--display);display:block;font-size:13px}

/* 戦闘：画面に余白があるときは、ルーンの説明を右、仲間の体力を左に出す（ほかは中央のまま） */
@media (min-width:1000px){
  #app{position:relative}
  /* 上端は敵の枠の上端にそろえる（top は描画時に敵の枠の位置を入れる） */
  .side-info{position:absolute;top:0;left:calc(100% + 24px);width:min(320px,calc(50vw - 296px));box-sizing:border-box;z-index:5}
  .side-party{position:absolute;top:0;right:calc(100% + 24px);width:min(260px,calc(50vw - 296px));grid-template-columns:1fr;box-sizing:border-box;z-index:5}
}

@media (prefers-reduced-motion:reduce){
  .circle i{animation:none!important}
  .float{animation-duration:.01s}
  .shake{animation:none}
  .cell.modpulse::before,.cell.modpulse .mod{animation-duration:.01s}
  .wheel{transition:none!important}
  .cell{transition:none}
}
</style>

<div id="app"></div>
<div id="fx" aria-hidden="true"></div>

<script>
"use strict";
/* ============ データ ============ */
const EL={fire:{n:'炎'},thunder:{n:'雷'},water:{n:'水'},forest:{n:'森'},star:{n:'星'},wind:{n:'風'}};
const RAR={c:'コモン',r:'レア',e:'エピック',x:'禁呪'};

// ルーンの定義：名前|レア度(c/r/e/x)|効果
// 効果の書き方：d=ダメージ a=全体ダメージ b=防御 h=回復 br=延焼 ba=全体延焼 dt=起爆 m数x回=連続攻撃 r数x回=ランダム攻撃
// p=貫通 x=とどめ v=脆弱 va=全体脆弱 w=弱体 s=力ダウン c=浄化 dr=吸収 t=反撃 bd=盾打ち mn=マナ pw=魔力
// dpt=雷の数比例 dpr=ルーン数比例 gn=周囲の成長 gk=世界樹の仲間の成長 sl=自傷 sp=自分に毒 sn=隣を封印 bs=延焼の伝播 dl=反響 bx=延焼2倍
// キーワード：ch=連鎖 fl=循環 g=成長 rs=共鳴
const RSRC={
fire:`
火球|c|d6
火の粉|c|d3,br2
業火|r|br5
炎の雨|r|a3,ba1
爆炎|e|br3,dt2
不死鳥の羽|e|br3,h2
血の契約|x|d15,sl3
火矢|c|m2x3
熾火|c|br3
炎の壁|c|b4,br1
野火|r|br2,bs
溶岩|r|p7
灼熱の剣|r|x8
太陽の欠片|e|ba4
灰燼|x|br2,dt3,sl4
火花|c|d4
小さな炎|c|d3,br1
焚き火|c|h2,br1
火打ち石|c|d5
燃えさし|c|br2,b2
火炎弾|c|d7,sl1
炎の拳|c|d5,br1
赤熱|c|v1,br1
炎の鞭|c|m3x2
火の玉連弾|c|m2x2,br1
点火|c|br4
煙幕|c|b5
熱波|c|a2
火炎放射|c|a2,ba1
炎の舌|c|d4,br1
火の鳥|c|r3x2
燎原の火|c|ba2
焦熱|c|x5
火薬|c|d8,sl2
炎の守り|c|b6
燻し|c|w1,br1
かまど|c|h3
火矢の雨|c|r2x3
炎の印|c|d3,v1

(function(){
  const MAP={d:'dmg',a:'dmgAll',b:'block',h:'heal',br:'burn',ba:'burnAll',dt:'detonate',p:'pierce',x:'execute',v:'vuln',va:'vulnAll',w:'weakE',s:'strDown',c:'cleanse',dr:'drain',t:'thorns',bd:'blockDmg',mn:'mana',pw:'power',dpt:'dmgPerThunder',dpr:'dmgPerRune',gn:'growNbr',gk:'growKin',sl:'self',sp:'selfPoison'};
  const FLAG={sn:'sealNeighbor',bs:'burnSpread',dl:'dupLast',cn:'chainNext'};
  MAP.ab='absorbDebuff';
  const NOUP=['mana','self','selfPoison'];
  const upOf=(t,v)=>NOUP.includes(t)?0:t==='blockDmg'?3:['detonate','dmgPerRune','vuln','vulnAll','weakE','strDown','power','growNbr','growKin'].includes(t)?1:Math.max(1,Math.round(v*0.4));
  for(const el in RSRC){
    const boost=(t,v)=>v;
    RSRC[el].trim().split('\n').forEach(line=>{
      const [n,r,spec]=line.trim().split('|');
      if(RUNES[n])console.warn('ルーン名が重複:',n);
      const d={n,e:el,r,fx:[],kw:[]};
      spec.split(',').forEach(raw=>{
        const tok=raw.trim();let m;
        if(tok==='ch'){d.kw.push('chain');return}
        if((m=tok.match(/^fl(\d+)$/))){d.kw.push('flow');d.flow=+m[1];d.fu=Math.max(1,Math.round(+m[1]*0.4));return}
        if((m=tok.match(/^g(\d+)$/))){d.kw.push('grow');d.grow=+m[1];return}
        if((m=tok.match(/^rs(\d+)$/))){d.kw.push('reso');d.reso=+m[1];return}
        if((m=tok.match(/^mo(\d+)$/))){d.kw.push('momentum');d.mom=+m[1];return}
        // bx4＝延焼4 ＋ 敵の延焼を2倍（1ターン1回）
        if((m=tok.match(/^bx(\d+)$/))){const v=+m[1];d.fx.push({t:'burn',v,u:upOf('burn',v)});d.fx.push({t:'burnDouble',v:0});return}
        if(FLAG[tok]){d.fx.push({t:FLAG[tok],v:0});return}
        if((m=tok.match(/^(m|r)(\d+)x(\d+)$/))){const v=boost(m[1]==='m'?'multi':'rand',+m[2]);d.fx.push({t:m[1]==='m'?'multi':'rand',v,u:Math.max(1,Math.round(v*0.4)),x:+m[3]});return}
        if((m=tok.match(/^([a-z]+)(\d+)$/))&&MAP[m[1]]){const t=MAP[m[1]],v=boost(t,+m[2]);d.fx.push({t,v,u:upOf(t,v)});return}
        console.warn('読めない効果:',n,tok);
      });
      RUNES[n]=d;
    });
  }
})();

// 詠唱の通り道（向きを変える紋章・反射・跳躍を反映）
function castPath(k,idx,rev){
  const N=S.run.N;let y,x,dy,dx;
  if(k==='r'){y=idx;x=rev?N-1:0;dy=0;dx=rev?-1:1}else{x=idx;y=rev?N-1:0;dx=0;dy=rev?-1:1}
  const path=[],visits={};let guard=0;
  while(y>=0&&x>=0&&y<N&&x<N&&guard++<N*N*3){
    const i=y*N+x;visits[i]=(visits[i]||0)+1;if(visits[i]>2)break;path.push(i);
    const m=S.run.board[i].m;let step=1;
    if(m==='turnU'){dy=-1;dx=0}else if(m==='turnD'){dy=1;dx=0}else if(m==='turnL'){dy=0;dx=-1}else if(m==='turnR'){dy=0;dx=1}
    else if(m==='mirror'){dy=-dy;dx=-dx}else if(m==='leap')step=2;
    y+=dy*step;x+=dx*step;
  }
  return path;
}

  const kw=d.kw||[];const lines=[];
  // 追い風・吸魔は別の行に出す
  const own=[];for(let j=d.fx.length-1;j>=0;j--)if(['chainNext','absorbDebuff','burnDouble'].includes(d.fx[j].t))own.unshift(parts.splice(j,1)[0]);
  if(parts.length)lines.push(parts.join('、'));
  own.forEach(t=>lines.push(t));
  if(kw.includes('chain'))lines.push('連鎖：直前に発動したルーンも雷なら、もう一度発動');
  if(kw.includes('flow'))lines.push(`循環：同じ詠唱で次に発動するルーンの主効果+${d.flow+(inst&&inst.up?d.fu:0)+(has('chalice')?2:0)}`);
  if(kw.includes('grow'))lines.push(`成長：発動するたび、この戦闘中だけ主効果+${growAmt(d)}`);
  if(kw.includes('reso'))lines.push(`共鳴：周囲8マスのルーン1つにつき主効果+${d.reso+(has('starmap')?1:0)}`);
  if(kw.includes('momentum'))lines.push(`疾風：同じ詠唱でこれより先に発動した回数1回につき主効果+${d.mom+(has('feather')?1:0)}`);

// 主効果以外の効果をマスに小さく出すための短い表記
function fxShort(f,v){
  switch(f.t){
    case 'multi':return '攻'+v+'×'+f.x;case 'rand':return '乱'+v+'×'+f.x;
    case 'detonate':return '爆×'+v;case 'dmgPerThunder':return '雷×'+v;case 'dmgPerRune':return '陣×'+v;case 'blockDmg':return '盾+'+v;
    case 'self':return '自傷'+v;case 'selfPoison':return '自毒'+v;case 'mana':return 'マナ+'+v;
    case 'sealNeighbor':return '封印';case 'burnSpread':return '伝播';case 'dupLast':return '反響';case 'burnDouble':return '焼×2';case 'chainNext':return '追い風';case 'absorbDebuff':return '吸魔'+v;
    case 'burnAll':return '全焼'+v;case 'vulnAll':return '全脆'+v;case 'strDown':return '力-'+v;case 'growNbr':return '育+'+v;case 'growKin':return '樹+'+v;
  }

}

  return d.fx.map((f,j)=>j===skip?'':fxShort(f,f.v+(inst&&inst.up?(f.u||0):0))).filter(Boolean).join(' ');

function tileVal(d,inst){
  const p=primIdx(d);
  if(p<0){
    if(d.fx[0]&&d.fx[0].t==='mana')return 'マナ+1';
    if(d.fx[0]&&d.fx[0].t==='burnSpread')return '伝播';
    if(d.fx[0]&&d.fx[0].t==='dupLast')return '反響';
    if(d.fx[0]&&d.fx[0].t==='chainNext')return '追い風';
    if(d.fx[0]&&d.fx[0].t==='absorbDebuff')return '吸魔'+(d.fx[0].v+(inst&&inst.up?(d.fx[0].u||0):0));
    if((d.kw||[]).includes('flow'))return '循'+(d.flow+(inst.up?d.fu:0));
    return '';
  }
  const f=d.fx[p];const v=f.v+(inst.up?(f.u||0):0)+inst.g;

function makeRun(charId,curse,online){
  const ch=CHARS[charId];const seed=(Math.random()*4294967296)>>>0;
  S.run={seed,rs:seed|0,bosses:pickBosses(),char:charId,curse,hp:ch.hp,maxHp:ch.hp,gold:60,act:0,floor:0,N:3,board:[],reserve:[null,null,null],relics:[],opts:null,pending:null,shop:null,ev:null,uid:1,online:!!online,stats:{kills:0,bestHit:0,turns:0}};
  for(let i=0;i<9;i++)S.run.board.push({r:null,m:null});
  ch.runes.forEach((id,i)=>{S.run.board[ch.pos?ch.pos[i]:i].r=mkRune(id);seeRune(id)});
  return S.run;
}
function newRun(charId,curse){makeRun(charId,curse,false);meta.runs++;saveMeta();saveRun();beginSetup(()=>goto('map'))}
function genOpts(){
  const r=S.run,len=ACTS[r.act].len,f=r.floor;
  if(f===len-1)return['boss'];
  if(f===0)return['battle'];
  if(f===len-2)return['camp'];
  if(f===Math.floor(len/2))return['treasure'];
  const n=rng()<0.5?2:3;const out=[];let g=0;
  while(out.length<n&&g++<60){const t=pickW({battle:45,event:18,camp:12,elite:f>=3?10:0 /* 各幕の1〜3階は精鋭（強敵）を出さない */,shop:10});if(!out.includes(t))out.push(t)}
  return out;
}
function chooseNode(t){const r=S.run;r.pending=t;r.opts=null;saveRun();startNode(t)}
function startNode(t){
  const r=S.run;
  if(t==='battle'||t==='elite'||t==='boss')return startCombat(t);
  if(t==='camp')return goto('camp');
  if(t==='shop'){if(!r.shop)genShop();saveRun();return goto('shop')}
  if(t==='event'){if(!r.ev)r.ev=pick(EVENTS).id;S.evResult=null;saveRun();return goto('event')}
  if(t==='treasure'){const id=rollRelics(1,false)[0];S.reward={relic:id};addRelic(id);return goto('treasure')}
}
function finishNode(){
  const r=S.run;const len=ACTS[r.act].len;
  if(r.online){r.pending=null;r.shop=null;r.ev=null;netDone();goto('wait');return}
  r.pending=null;r.shop=null;r.ev=null;r.floor++;
  if(r.floor>=len){r.act++;r.floor=0;if(r.act>=1&&!meta.reached2){meta.reached2=true;saveMeta()}}
  saveRun();goto('map');
}
function endRun(win){
  const r=S.run;
  if(win){meta.clears++;meta.maxCurse=Math.max(meta.maxCurse,Math.min(10,r.curse+1))}
  // 戦績に記録
  const reach=win?999:r.act*100+r.floor;
  meta.hist.unshift({t:Date.now(),char:r.char,win,act:r.act,floor:r.floor,curse:r.curse,kills:r.stats.kills,best:r.stats.bestHit,turns:r.stats.turns,online:!!r.online});
  meta.hist=meta.hist.slice(0,50);
  const bc=meta.byChar[r.char]=meta.byChar[r.char]||{runs:0,clears:0,reach:-1,best:0,kills:0};
  bc.runs++;if(win)bc.clears++;bc.reach=Math.max(bc.reach,reach);bc.best=Math.max(bc.best,r.stats.bestHit);bc.kills+=r.stats.kills;
  meta.kills=(meta.kills||0)+r.stats.kills;meta.bestReach=Math.max(meta.bestReach==null?-1:meta.bestReach,reach);
  const L=meta.byCurse[r.curse]=meta.byCurse[r.curse]||Object.assign(newStat(),{chars:{}});addStat(L,meta.hist[0]);
  L.chars[r.char]=L.chars[r.char]||newStat();addStat(L.chars[r.char],meta.hist[0]);
  meta.bestHit=Math.max(meta.bestHit,r.stats.bestHit);saveMeta();if(!r.online)drop(RK);
  S.endInfo={online:!!r.online,win,act:r.act,floor:r.floor,kills:r.stats.kills,best:r.stats.bestHit,turns:r.stats.turns,char:r.char,curse:r.curse,seed:r.seed};
  S.run=null;S.cb=null;goto('end');
}

/* ============ 戦闘 ============ */
function makeEnemies(kind,n){
  const r=S.run,A=r.act;let ids;
  if(kind==='boss')ids=[bossOf(A)];else if(kind==='elite')ids=pick(ENC[A].elite);else ids=pick(r.floor<3?ENC[A].easy:ENC[A].normal);
  const hpM=DIFF.hp*(1+0.08*r.curse)*(kind==='boss'?DIFF.bossHp:(1+DIFF.floor*r.floor)*(kind==='elite'?DIFF.eliteHp:1))*n*(DIFF.actHp[A]||1);
  const am=(kind==='boss'?DIFF.bossAtk:kind==='elite'?DIFF.eliteAtk:1)*(1+ONLINE_ATK*(n-1))*(DIFF.actAtk[A]||1);
  const out=ids.map(id=>mkEnemy(id,hpM,am));
  saveMeta();return out;
}
function mkEnemy(id,hpM,am){
  const m=MON[id];const hp=Math.max(1,Math.round(m.hp*hpM));meta.seen.mons[id]=1;
  return{id,n:m.n,hp,max:hp,hpM,am,enraged:false,block:0,str:0,burn:0,vuln:0,weak:0,mi:m.boss||m.fixed?0:Math.floor(rng()*m.mv.length),boss:!!m.boss,immune:null,plate:m.plate||0,stole:0};
}
// 召喚・分裂：敵は同時に4体まで
function spawnEnemy(list,id,from,hp){
  if(list.filter(e=>e.hp>0).length>=4)return null;
  const e=mkEnemy(id,from.hpM||1,from.am||1);e.boss=false;
  if(hp!=null){e.hp=hp;e.max=hp}
  if(S.cb&&S.cb.online&&NET.cs){const al=NET.cs.order.filter(p=>!NET.cs.pl[p].down&&present(p));e.tg=al.length?pick(al):from.tg}
  list.push(e);return e;
}
// ギミックの説明（敵を選ぶと出る）
const TRAIT_TXT={
  spikes:v=>`トゲ${v}：攻撃を受けるたび、こちらに${v}ダメージを返す`,
  regen:v=>`再生${v}：行動の前にHPを回復する`,
  plate:()=>`装甲：行動の前に装甲と同じだけ防御を得る。HPにダメージを受けるたび装甲-1`,
  split:()=>`分裂：HPが半分以下になると、残りのHPを分け合って2体に分かれる`,
  rage:v=>`怒り：ダメージを受けるたび力+${v}（1ターンに3回まで）`,
  ritual:v=>`儀式：行動の前に力+${v}`,
  immune:()=>`属性無効：毎ターン、どれか1つの属性が効かなくなる`,
};
function traitLines(e){const m=MON[e.id],out=[];for(const k in TRAIT_TXT){if(!m[k])continue;if(k==='split'&&e.splitDone)continue;if(k==='plate'&&!e.plate)continue;out.push(TRAIT_TXT[k](m[k]))}
  if(e.intangible)out.push('実体なし：次の行動まで、受けるダメージが1回につき1になる');
  if(e.stole)out.push(`盗んだゴールド ${e.stole}：逃げる前に倒すと取り返せる`);
  return out}
function bossDesc(id){const m=MON[id];const t=[];if(m.split)t.push('分裂');if(m.rage)t.push('怒り');if(m.regen)t.push('再生');if(m.plate)t.push('装甲');if(m.spikes)t.push('トゲ');if(m.ritual)t.push('儀式');if(m.immune)t.push('属性無効');if(m.mv.some(x=>x.some(a=>a.a==='summon')))t.push('召喚');
  return 'この幕のボス。倒すと魔法陣が広がる'+(t.length?`（${t.join('・')}）`:'')}
function startCombat(kind){
  flushTray();const r=S.run;allRunes().forEach(x=>x.inst.g=0);
  const enemies=makeEnemies(kind,1);
  S.cb={kind,enemies,turn:0,mana:0,used:{r:[],c:[]},block:0,poison:0,weak:0,power:0,sealed:Array(r.N*r.N).fill(0),once:{},rev:false,revUsed:false,target:0,busy:false,hl:-1,info:null,fxq:[],log:[]};
  combatStartRelics();startTurn();firstTurnRelics(S.cb.enemies);goto('combat');
}
// 戦闘開始時の秘宝（自分だけに効くもの）
function combatStartRelics(){

  if(has('rod')&&r.char==='witch'){c.charge=(c.charge||0)+1;c.chainN=(c.chainN||0)+CHARGE_EVERY}
  if(has('moss'))allRunes().forEach(x=>{if(RUNES[x.inst.id].e==='forest')x.inst.g+=2});
}
// 最初のターンに敵へ効く秘宝（オンラインでは自分の最初の番に使う）
function firstTurnRelics(enemies){
  const c=S.cb;const al=enemies.filter(e=>e.hp>0);
  if(has('whet')){c.power+=1;fx('p',0,'魔力+1','info')}
  if(has('flask'))al.forEach(e=>{if(e.immune!=='fire'){e.burn+=3+(has('scale')?1:0);fx('e',enemies.indexOf(e),'延焼+3','burn')}});
  if(has('mirror'))al.forEach(e=>{e.vuln+=2;fx('e',enemies.indexOf(e),'脆弱+2','info')});
  if(has('bell')&&(c.kind==='elite'||c.kind==='boss')){c.block+=12;fx('p',0,'防御+12','blk')}
}
function startTurn(){
  const c=S.cb,r=S.run,N=r.N;
  c.turn++;r.stats.turns++;
  c.block=(c.turn===1&&has('hat')?8:0)+(has('iron')?3:0);
  c.mana=3+(has('crystal')?1:0)+(c.turn===1&&has('hourglass')?2:0);
  c.used={r:Array(N).fill(0),c:Array(N).fill(0)};c.once={};c.thorns=has('thornc')?2:0;c.rev=false;c.revUsed=false;c.swap=null;c.swapUsed=false;
  if(has('amulet')){c.poison=Math.max(0,c.poison-2);c.weak=Math.max(0,c.weak-1)}
  c.enemies.forEach(e=>{if(MON[e.id].immune&&e.hp>0){e.immune=pick(Object.keys(EL))}});
}
const alive=()=>S.cb.enemies.filter(e=>e.hp>0);
const allDead=()=>alive().length===0;
function tgt(){const c=S.cb;let e=c.enemies[c.target];if(!e||e.hp<=0){const k=c.enemies.findIndex(x=>x.hp>0);c.target=k<0?0:k;e=c.enemies[k]}return e}
function log(t){const c=S.cb;if(!c)return;c.log.push(t);if(c.log.length>4)c.log.shift();if(S.rec)S.rec.log.push(t)}
function fx(k,i,text,cls){S.cb.fxq.push({k,i,text,cls});if(S.rec&&S.rec.cur)S.rec.cur.fx.push({k,i,text,cls})}
// 不死鳥の尾羽：一人用で一度だけ、倒れてもHP30%で立ち上がる
function survive(){const r=S.run;if(r.hp>0)return true;if(!r.online&&has('phoenix')&&!r.phoenixUsed){r.phoenixUsed=true;r.hp=Math.round(r.maxHp*0.3);if(S.cb){fx('p',0,'不死鳥 +'+r.hp,'heal');log('不死鳥の尾羽で立ち上がった')}return true}return false}
function healP(v){const r=S.run;const before=r.hp;r.hp=Math.min(r.maxHp,r.hp+v);if(S.cb&&r.hp>before)fx('p',0,'+'+(r.hp-before),'heal')}
function hit(e,raw,el,o={}){
  const c=S.cb,r=S.run;if(!e||e.hp<=0)return 0;
  const ei=c.enemies.indexOf(e);
  if(e.immune&&e.immune===el){fx('e',ei,'無効','info');return 0}
  let d=raw+c.power;if(c.weak>0)d=Math.floor(d*0.75);if(e.vuln>0)d=Math.floor(d*1.5);d=Math.max(0,d);
  if(e.intangible)d=Math.min(d,1);
  const blk=o.pierce?0:Math.min(e.block,d);e.block-=blk;const dmg=d-blk;e.hp-=dmg;
  fx('e',ei,dmg>0?'-'+dmg:'防御','dmg');
  if(d>r.stats.bestHit)r.stats.bestHit=d;
  const M=MON[e.id];
  if(dmg>0&&e.plate>0){e.plate--}
  if(M.spikes){const sp=M.spikes;const b=Math.min(c.block,sp);c.block-=b;r.hp-=sp-b;fx('p',0,sp-b>0?'トゲ -'+(sp-b):'防御','pdmg')}
  if(M.rage&&dmg>0&&e.hp>0&&(e.rageT||0)<3){e.rageT=(e.rageT||0)+1;e.str+=M.rage;fx('e',ei,'力+'+M.rage,'info')}
  if(M.split&&!e.splitDone&&e.hp>0&&e.hp<=e.max/2){e.splitDone=true;const half=Math.ceil(e.hp/2);const sp2=spawnEnemy(c.enemies,e.id,e,e.hp-half);if(sp2){sp2.splitDone=true;sp2.n=e.n+'（分身）';e.hp=half;e.max=Math.max(half,Math.round(e.max/2));fx('e',ei,'分裂','info');log(`${e.n}が分裂した`)}}
  if(e.boss&&!e.enraged&&e.hp>0&&e.hp<=e.max/2){const s=3+r.act*2;e.enraged=true;e.str+=s;fx('e',ei,'激昂','info');log(`${e.n}が激昂した（力+${s}）`)}
  if(e.hp<=0){e.hp=0;r.stats.kills++;log(`${e.n}を倒した`);if(has('fang'))healP(3);
    if(e.stole){r.gold+=e.stole;log(`盗まれた${e.stole}ゴールドを取り返した`);e.stole=0}
    if(has('heart')&&!c.once.heart){c.once.heart=1;c.mana++;fx('p',0,'マナ+1','blk')}}
  return dmg;
}
function neighbors(i){const N=S.run.N,y=Math.floor(i/N),x=i%N;let n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const yy=y+dy,xx=x+dx;if(yy<0||xx<0||yy>=N||xx>=N)continue;if(S.run.board[yy*N+xx].r)n++}return n}
function neighborIdx(i){const N=S.run.N,y=Math.floor(i/N),x=i%N;const out=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const yy=y+dy,xx=x+dx;if(yy<0||xx<0||yy>=N||xx>=N)continue;out.push(yy*N+xx)}return out}
function isCorner(i){const N=S.run.N,y=Math.floor(i/N),x=i%N;return(y===0||y===N-1)&&(x===0||x===N-1)}

// 雷の魔女の帯電：連鎖が起きるたびに溜まり、この戦闘中ずっと雷のダメージに上乗せされる
const CHARGE_EVERY=2,CHARGE_FX=['dmg','dmgAll','multi','rand','pierce','execute','drain'];
async function applyRune(i,d,inst,cell,ctx,flowIn){
  const c=S.cb,r=S.run;const p=primIdx(d);
  let bonus=flowIn+inst.g+(cell.m==='amp'?3:0)+(inst.up&&has('quill')?1:0);
  if((d.kw||[]).includes('reso'))bonus+=(neighbors(i)+(has('lens')?1:0))*(d.reso+(has('starmap')?1:0));
  if((d.kw||[]).includes('momentum'))bonus+=(ctx.count||0)*(d.mom+(has('feather')?1:0));
  const mult=cell.m==='double'?2:1;
  for(let j=0;j<d.fx.length;j++){const f=d.fx[j];
    let v=f.v+(inst.up?(f.u||0):0);if(j===p)v+=bonus;if(!NOMULT.includes(f.t))v*=mult;
    if(c.charge&&d.e==='thunder'&&CHARGE_FX.includes(f.t))v+=c.charge; // 雷の魔女：帯電
    const t=tgt();
    switch(f.t){
      case 'dmg':hit(t,v,d.e);break;
      case 'dmgAll':alive().forEach(e=>hit(e,v,d.e));break;
      case 'burn':if(t){if(t.immune===d.e){fx('e',c.enemies.indexOf(t),'無効','info');break}t.burn+=v+(has('scale')?1:0);fx('e',c.enemies.indexOf(t),'延焼+'+(v+(has('scale')?1:0)),'burn')}break;
      case 'burnAll':alive().forEach(e=>{if(e.immune===d.e)return;e.burn+=v+(has('scale')?1:0)});break;
      case 'detonate':if(t){const dm=t.burn*v;t.burn=0;hit(t,dm,d.e)}break;
      case 'heal':healP(v);break;
      case 'absorbDebuff':if(t&&!c.once[i+'a']){const ei=c.enemies.indexOf(t);
        // 脆弱・弱体・力低下の値をそのまま吸う（延焼は対象外）
        const n=t.vuln+t.weak+Math.max(0,-t.str);
        if(n>0){c.once[i+'a']=1;c.power+=n*v;t.vuln=0;t.weak=0;if(t.str<0)t.str=0;fx('e',ei,'デバフを吸った','info');fx('c',i,'魔力+'+n*v,'info')}else fx('c',i,'吸えるデバフなし','info')}break;
      case 'chainNext':ctx.forceChain=true;fx('c',i,'追い風','info');break;
      case 'block':c.block+=v;fx('p',0,'防御+'+v,'blk');break;
      case 'self':r.hp-=v;fx('p',0,'-'+v,'pdmg');break;
      case 'selfPoison':c.poison+=v;break;
      case 'vuln':if(t){t.vuln+=v;fx('e',c.enemies.indexOf(t),'脆弱+'+v,'info')}break;
      case 'mana':if(!c.once[i+'m']){c.once[i+'m']=1;c.mana+=v;fx('c',i,'マナ+'+v,'blk')}break;
      case 'power':if(!c.once[i+'p']){c.once[i+'p']=1;c.power+=v;fx('c',i,'魔力+'+v,'info')}break;
      case 'dmgPerThunder':hit(t,v*Math.max(1,ctx.thunder),d.e);break;
      case 'multi':for(let k=0;k<f.x;k++){if(allDead())break;hit(tgt(),v,d.e);if(k<f.x-1){render();await sleep(230)}}break;
      case 'rand':for(let k=0;k<f.x;k++){const al=alive();if(!al.length)break;hit(pick(al),v,d.e);if(k<f.x-1){render();await sleep(230)}}break;
      case 'pierce':hit(t,v,d.e,{pierce:true});break;
      case 'execute':if(t)hit(t,t.hp<=t.max/2?v*2:v,d.e);break;
      case 'burnSpread':if(t&&t.burn>0){const b=t.burn;alive().forEach(e=>{if(e!==t&&e.immune!=='fire'){e.burn+=b;fx('e',c.enemies.indexOf(e),'延焼+'+b,'burn')}})}break;
      case 'weakE':if(t){t.weak+=v;fx('e',c.enemies.indexOf(t),'弱体+'+v,'info')}break;
      case 'vulnAll':alive().forEach(e=>{e.vuln+=v});break;
      case 'strDown':if(t){t.str-=v;fx('e',c.enemies.indexOf(t),'力-'+v,'info')}break;
      case 'cleanse':c.poison=Math.max(0,c.poison-v);c.weak=Math.max(0,c.weak-1);break;
      case 'drain':{const dm=hit(t,v,d.e);if(dm>0)healP(Math.floor(dm/2))}break;
      case 'thorns':c.thorns+=v;fx('p',0,'反撃+'+v,'blk');break;
      case 'growKin':r.board.forEach((cl,k)=>{if(k!==i&&cl.r&&RUNES[cl.r.id]&&RUNES[cl.r.id].n.includes('世界樹')){cl.r.g+=v;fx('c',k,'成長+'+v,'grow')}});break;
      case 'growNbr':neighborIdx(i).forEach(k=>{const o=r.board[k].r;if(o&&RUNES[o.id].e==='forest')o.g+=v});break;
      case 'blockDmg':hit(t,c.block+v,d.e);break;
      case 'burnDouble':if(t&&t.burn>0&&t.immune!=='fire'&&!c.once[i+'x']){c.once[i+'x']=1;t.burn*=2;fx('e',c.enemies.indexOf(t),'延焼×2','burn')}break;
      case 'dmgPerRune':hit(t,v*r.board.filter(x=>x.r).length,d.e);break;
      case 'dupLast':{const L=ctx.last;if(L&&!L.d.fx.some(x=>x.t==='dupLast')&&!allDead()){fx('c',i,'反響','info');render();await sleep(200);await applyRune(L.i,L.d,L.inst,L.cell,ctx,0);ctx.count=(ctx.count||0)+1}}break;
      case 'sealNeighbor':{const cand=neighborIdx(i).filter(k=>r.board[k].r&&c.sealed[k]<2);if(cand.length){const k=pick(cand);c.sealed[k]=2;fx('c',k,'封印','info')}}break;
    }
  }
}
async function activate(i,ctx){
  const c=S.cb,r=S.run,cell=r.board[i],inst=cell.r;
  if(!inst){ctx.prev=null;ctx.flow=0;return}
  const d=RUNES[inst.id];
  if(c.sealed[i]>0){fx('c',i,'封印中','info');ctx.prev=null;ctx.flow=0;return}
  const kw=d.kw||[];let times=1,chained=false;
  if(kw.includes('chain')){
    if(ctx.prev==='thunder'){times=2;chained=true}
    else if(ctx.forceChain){times=2;chained=true;ctx.forceChain=false}
    else if(r.char==='witch'&&ctx.thunder>0&&!ctx.grace){times=2;chained=true;ctx.grace=true}
  }
  const tags=chained?['','連鎖']:[''];if(has('corner')&&isCorner(i)){times++;tags.push('四隅')}
  if(cell.m==='echo'&&!c.once[i+'e']){c.once[i+'e']=1;times++;tags.push('反復')}
  const flowIn=ctx.flow;ctx.flow=0;
  if(d.e==='thunder')ctx.thunder++;
  for(let k=0;k<times;k++){
    if(allDead())break;
    if(k>0){c.hl=-1;render();await sleep(120);c.hl=i;fx('c',i,`${tags[k]}・${k+1}回目`,'info');render();await sleep(230)}
    await applyRune(i,d,inst,cell,ctx,flowIn);ctx.count=(ctx.count||0)+1; // 疾風用：発動の回数（連鎖・四隅・反復の2回目も数える）
    if(d.fx.length&&cell.m==='double')fx('c',i,'倍化の紋章 ×2','mod');
    if(d.e==='water'&&has('pearl')){c.block+=1}
    if(d.fx.length&&cell.m==='amp')fx('c',i,'増幅の紋章 +3','mod');
    if(tags[k]==='連鎖'&&has('ring'))hit(tgt(),2,'thunder');

    if(times>1){render();await sleep(320)}
  }
  if(cell.m==='guard'){c.block+=4;fx('c',i,'守護の紋章 防御+4','mod');fx('p',0,'防御+4','blk')}

  if(cell.m==='echo')fx('c',i,'','mod');
  if(cell.m==='life'){healP(2);fx('c',i,'','mod')}
  if(cell.m==='curse'){const t=tgt();if(t){t.vuln+=1;fx('e',c.enemies.indexOf(t),'脆弱+1','info')}fx('c',i,'','mod')}
  if(cell.m==='ember'){const t=tgt();if(t&&t.immune!=='fire'){t.burn+=2;fx('e',c.enemies.indexOf(t),'延焼+2','burn')}fx('c',i,'','mod')}
  if(kw.includes('flow'))ctx.flow=d.flow+(inst.up?d.fu:0)+(has('chalice')?2:0);
  if(kw.includes('grow'))inst.g+=growAmt(d);
  ctx.prev=d.e;ctx.last={i,d,inst,cell};
}
async function cast(k,idx){
  const c=S.cb,r=S.run,N=r.N;if(!c||c.busy)return;if(c.online&&!myTurn())return;
  const lim=has('crown')?2:1;if(c.mana<1||c.used[k][idx]>=lim)return;
  c.busy=true;c.mana--;c.used[k][idx]++;c.info=null;c.swap=null;
  const rev=c.rev&&!c.revUsed;if(rev){c.revUsed=true;c.rev=false;log('逆詠唱')}
  const cells=castPath(k,idx,rev);
  const ctx={prev:null,flow:0,thunder:0,grace:false,count:has('kite')?1:0,forceChain:false};
  // オンライン：仲間の画面で再生できるように、マスごとの演出を記録する
  if(c.online)S.rec={id:NET.me+':'+Date.now().toString(36)+':'+Math.floor(Math.random()*1e4),pid:NET.me,k,idx,rev,steps:[],log:[],cur:null};
  for(const i of cells){
    if(allDead()||(r.hp<=0&&!survive()))break;
    if(S.rec){S.rec.cur={i,fx:[]};S.rec.steps.push(S.rec.cur)}
    c.hl=i;render();await sleep(200);
    await activate(i,ctx);if(PATH_MODS.includes(r.board[i].m))fx('c',i,'','mod');
    if(S.rec)Object.assign(S.rec.cur,{hp:c.enemies.map(e=>e.hp),bl:c.enemies.map(e=>e.block),me:Math.max(0,r.hp)});
    render();await sleep(110);
  }
  if(S.rec&&NET.cs){const{cur,...rec}=S.rec;NET.cs.cast=rec;S.rec=null}
  c.hl=-1;c.busy=false;
  if(c.online){render();return afterOnlineCast()}
  if(!survive()){render();await sleep(400);return endRun(false)}
  if(allDead()){render();await sleep(450);return winCombat()}
  render();
  // マナが尽きたら自動でターン終了
  if(c.mana<1){await sleep(450);if(S.cb===c&&!c.busy&&c.mana<1&&S.screen==='combat')endTurn()}
}
// 敵が行動する前の処理（防御のリセット・装甲・再生・儀式・実体の戻り）
function enemyPre(e,list){
  const M=MON[e.id],ei=list.indexOf(e);
  e.block=0;e.rageT=0;if(e.intangible){e.intangible=false}
  if(e.plate>0){e.block+=e.plate;fx('e',ei,'装甲 防御+'+e.plate,'blk')}
  if(M.regen&&e.hp<e.max){const v=sc(M.regen,e);e.hp=Math.min(e.max,e.hp+v);fx('e',ei,'再生 +'+v,'heal')}
  if(M.ritual){e.str+=M.ritual;fx('e',ei,'儀式 力+'+M.ritual,'info')}
}
function sc(v,e){return Math.round(v*DIFF.atk*(e&&e.am||1)*(1+0.06*S.run.curse))}
function atkVal(e,v){let d=sc(v,e)+e.str;if(e.weak>0)d=Math.floor(d*0.75);return Math.max(0,d)}
async function enemyAct(e,a){
  const c=S.cb,r=S.run,ei=c.enemies.indexOf(e);
  switch(a.a){
    case 'atk':for(let k=0;k<a.x;k++){const d=atkVal(e,a.v);const blk=Math.min(c.block,d);c.block-=blk;const dm=d-blk;r.hp-=dm;fx('p',0,dm>0?'-'+dm:'防御','pdmg');
      if(c.thorns>0&&e.hp>0){e.hp=Math.max(0,e.hp-c.thorns);fx('e',ei,'反撃 -'+c.thorns,'dmg');if(e.hp<=0){r.stats.kills++;log(`${e.n}を反撃で倒した`);if(has('fang'))healP(3)}}
      render();shake('#pbar');await sleep(200);if(r.hp<=0||e.hp<=0)return}break;
    case 'block':{const v=sc(a.v,e);e.block+=v;fx('e',ei,'防御+'+v,'blk')}break;
    case 'str':e.str+=a.v;fx('e',ei,'力+'+a.v,'info');break;
    case 'poison':{const pv=sc(a.v,e);const v=has('lantern')?Math.floor(pv/2):pv;c.poison+=v;fx('p',0,'毒+'+v,'info')}break;
    case 'weak':c.weak+=a.v;fx('p',0,'弱体+'+a.v,'info');break;
    case 'heal':{const v=sc(a.v,e);e.hp=Math.min(e.max,e.hp+v);fx('e',ei,'+'+v,'heal')}break;
    case 'healAll':{const v=sc(a.v,e);alive().forEach(x=>{x.hp=Math.min(x.max,x.hp+v);fx('e',c.enemies.indexOf(x),'+'+v,'heal')})}break;
    case 'seal':{const cand=r.board.map((cl,i)=>cl.r&&c.sealed[i]<1?i:-1).filter(i=>i>=0);for(const i of shuffle(cand).slice(0,a.v)){c.sealed[i]=1;fx('c',i,'封印','info')}log(`${e.n}がルーンを封印した`)}break;
    case 'summon':{let n=0;for(let k=0;k<a.n;k++)if(spawnEnemy(c.enemies,a.id,e))n++;if(n)log(`${e.n}が${MON[a.id].n}を呼んだ`);else fx('e',ei,'呼べなかった','info')}break;
    case 'boom':{const d=atkVal(e,a.v);const blk=Math.min(c.block,d);c.block-=blk;r.hp-=d-blk;fx('p',0,d-blk>0?'-'+(d-blk):'防御','pdmg');shake('#pbar');e.hp=0;fx('e',ei,'自爆','dmg');log(`${e.n}が自爆した`)}break;
    case 'steal':{const d=atkVal(e,a.v);const blk=Math.min(c.block,d);c.block-=blk;r.hp-=d-blk;fx('p',0,d-blk>0?'-'+(d-blk):'防御','pdmg');shake('#pbar');
      const g=Math.min(r.gold,10+5*r.act);if(g>0){r.gold-=g;e.stole+=g;fx('e',ei,g+'G 盗んだ','info');log(`${e.n}に${g}ゴールド盗まれた`)}}break;
    case 'flee':e.hp=0;e.fled=true;fx('e',ei,'逃走','info');log(e.stole?`${e.n}が${e.stole}ゴールドを持って逃げた`:`${e.n}は逃げ出した`);break;
    case 'blockAll':{const v=sc(a.v,e);c.enemies.filter(x=>x.hp>0).forEach(x=>{x.block+=v;fx('e',c.enemies.indexOf(x),'防御+'+v,'blk')})}break;
    case 'phase':e.intangible=true;fx('e',ei,'実体が消えた','info');break;
    case 'charge':fx('e',ei,'力をためている','info');break;
  }
  render();await sleep(120);
}
async function endTurn(){
  const c=S.cb,r=S.run;if(!c||c.busy)return;if(c.online)return endTurnOnline();c.busy=true;c.info=null;c.rev=false;
  for(const e of alive()){if(e.burn>0){e.hp-=e.burn;fx('e',c.enemies.indexOf(e),'-'+e.burn,'burn');e.burn--;if(e.hp<=0){e.hp=0;r.stats.kills++;log(`${e.n}は燃え尽きた`);if(has('fang'))healP(3)}}}
  if(c.poison>0){r.hp-=c.poison;fx('p',0,'毒 -'+c.poison,'pdmg');c.poison--}
  c.weak=Math.max(0,c.weak-1);
  c.enemies.forEach(e=>{e.vuln=Math.max(0,e.vuln-1)});
  c.sealed=c.sealed.map(v=>Math.max(0,v-1));
  render();
  if(!survive()){await sleep(500);return endRun(false)}
  if(allDead()){await sleep(450);return winCombat()}
  await sleep(380);
  for(const e of [...c.enemies]){
    if(e.hp<=0)continue;
    enemyPre(e,c.enemies);
    const mv=MON[e.id].mv[e.mi];
    shake(`[data-eid="${c.enemies.indexOf(e)}"]`);
    for(const a of mv){await enemyAct(e,a);if(r.hp<=0&&!survive())break}
    e.mi=(e.mi+1)%MON[e.id].mv.length;e.weak=Math.max(0,e.weak-1);
    render();
    if(!survive()){await sleep(500);return endRun(false)}
    if(allDead()){await sleep(450);return winCombat()}
    await sleep(260);
  }
  startTurn();c.busy=false;render();
}
function winCombat(){
  const c=S.cb,r=S.run,kind=c.kind;allRunes().forEach(x=>x.inst.g=0);
  if(kind==='boss'&&r.act===2){return endRun(true)}
  let gold=kind==='boss'?70:kind==='elite'?30+Math.floor(rng()*11):12+Math.floor(rng()*9);
  if(has('purse'))gold=Math.round(gold*1.5);
  r.gold+=gold;
  if(has('necklace'))r.hp=Math.min(r.maxHp,r.hp+5);
  S.queue=[];
  if(kind==='battle')S.queue.push({t:'runes',opts:rollRunes(3,'normal')});
  if(kind==='elite'){S.queue.push({t:'mod',opts:shuffle(Object.keys(MODS)).slice(0,2)});S.queue.push({t:'runes',opts:rollRunes(3,'elite')})}
  if(kind==='boss'){
    r.hp=Math.min(r.maxHp,r.hp+Math.round(r.maxHp*0.3));
    S.queue.push({t:'relic',opts:rollRelics(3,true)});
    if(r.N<5)S.queue.push({t:'expand'});
  }
  S.reward={gold,kind};S.cb=null;saveRun();goto('reward');
}

/* --- 戦闘 --- */
function intentText(e,on){
  // オンライン：攻撃は全員に、毒・弱体・封印は狙われた1人に
  const who=on&&e.tg&&NET.cs&&NET.cs.pl[e.tg]?` → ${esc(NET.cs.pl[e.tg].nick)}`:'';
  return MON[e.id].mv[e.mi].map(a=>{switch(a.a){
    case 'atk':{const v=atkVal(e,a.v);return (a.x>1?`攻撃 ${v}×${a.x}`:`攻撃 ${v}`)+(on?' → 全員':'')}
    case 'poison':return `毒 ${sc(a.v,e)}${who}`;case 'weak':return `弱体 ${a.v}${who}`;case 'seal':return `封印 ${a.v}${who}`;
    case 'summon':return `召喚（${MON[a.id].n}${a.n>1?'×'+a.n:''}）`;case 'boom':return `自爆 ${atkVal(e,a.v)}`+(on?' → 全員':'');
    case 'steal':return `強奪 ${atkVal(e,a.v)}`+(on?' → 全員':'');case 'flee':return '逃げようとしている';
    case 'blockAll':return `味方全体に防御 ${sc(a.v,e)}`;case 'phase':return '実体が消える';case 'charge':return '力をためている';
    case 'block':return `防御 ${sc(a.v,e)}`;case 'str':return `力 +${a.v}`;case 'poison':return `毒 ${sc(a.v,e)}`;
    case 'weak':return `弱体 ${a.v}`;case 'heal':return `回復 ${sc(a.v,e)}`;case 'healAll':return `全体回復 ${sc(a.v,e)}`;case 'seal':return `封印 ${a.v}`;}}).join('・');
}
function rCombat(){

      if(M.rage)st.push(`<span class="chip c-hp">怒り</span>`);if(M.ritual)st.push(`<span class="chip c-star">儀式</span>`);if(M.split&&!e.splitDone)st.push(`<span class="chip">分裂</span>`);if(e.intangible)st.push(`<span class="chip c-star">実体なし</span>`);if(e.stole)st.push(`<span class="chip" style="color:var(--gold)">${e.stole}G</span>`)}}

  let head=`<div class="panel"><h2>${rw.kind==='boss'?'ボスを倒した':'勝利'}</h2><p class="num">${rw.gold?`${rw.gold}ゴールドを手に入れた（所持 ${S.run.gold} G）`:''}${rw.kind==='boss'?'・HPが30%回復した':''}</p></div>`;
  if(!q)return head;
  if(q.t==='runes'){const sp=hasSpace();return `${head}<h3>ルーンを1つ選ぶ</h3>${sp?'':`<div class="panel confirm"><p class="small">${FULL_NOTE}</p></div>`}<div class="cards">${q.opts.map(id=>runeCard(id,`data-a="pickrune" data-k="${id}" ${sp?'':'disabled'}`)).join('')}</div><button class="btn ${sp?'ghost':'primary'} wide" data-a="skip">受け取らない</button>`}
  if(q.t==='mod')return `${head}<h3>紋章を1つ選ぶ</h3><p class="small muted">選んだ紋章は魔法陣のマスに刻む。マスに付くので、ルーンを入れ替えても残る。</p><div class="cards">${q.opts.map(m=>`<button class="rcard" data-a="pickmod" data-k="${m}"><span class="nm">${MODS[m].n}</span><span class="d">${MODS[m].d}</span></button>`).join('')}</div><button class="btn ghost wide" data-a="skip">受け取らない</button>`;
  if(q.t==='relic')return `${head}<h3>秘宝を1つ選ぶ</h3><div class="cards">${q.opts.map(k=>`<button class="rcard" data-a="pickrelic" data-k="${k}"><span class="nm" style="color:var(--gold)">${RELICS[k].n}</span><span class="d">${RELICS[k].d}</span>${RELICS[k].boss?'<span class="rar">ボス秘宝</span>':''}</button>`).join('')}</div>`;
  if(q.t==='expand')return `${head}<div class="panel"><h3>魔法陣が${S.run.N+1}×${S.run.N+1}に広がる</h3><p class="small">新しいマスにルーンを置いて、組み替えよう。マナは3のままなので、どこに何を置くかがより大事になる。</p><button class="btn primary" data-a="doexpand">魔法陣を組み替える</button></div>`;
  return head;
}

/* --- 魔法陣の編集 --- */
// 強化前と強化後を並べて表示。変わる数字だけ色を変える
function markDiff(nw,old){
  const a=nw.split(/(\d+)/),b=(old||'').split(/(\d+)/);
  return a.map((p,k)=>/^\d+$/.test(p)&&p!==b[k]?`<b class="up">${p}</b>`:p).join('');
}
function upgradeCompare(inst){
  const d=RUNES[inst.id];const after={...inst,up:true};
  const a=descRune(d,inst),b=descRune(d,after);
  const before=`<div class="cmp-col"><p class="label">いま</p><p class="nm">${d.n} <span class="rv e-${d.e}">${tileVal(d,inst)}</span></p>${a.map(l=>`<p>${l}</p>`).join('')}</div>`;
  const aft=`<div class="cmp-col after"><p class="label">強化後</p><p class="nm">${d.n}+ <span class="rv e-${d.e}">${markDiff(tileVal(d,after),tileVal(d,inst))}</span></p>${b.map((l,k)=>`<p>${markDiff(l,a[k])}</p>`).join('')}</div>`;
  return `<div class="cmp">${before}<span class="arrow" aria-hidden="true">→</span>${aft}</div>`;
}
function rEdit(){
  const r=S.run,N=r.N,m=S.editMode,sel=S.ui.sel;
  const T={moveMod:'紋章の位置を変える',place:'ルーンを配置する',arrange:'魔法陣を組み替える',placeMod:'紋章を刻むマスを選ぶ',upgrade:'強化するルーンを選ぶ',remove:'処分するルーンを選ぶ',discard:'ルーンがいっぱい。1つ手放す'};
  const SUB={moveMod:`動かす紋章のマスを選び、次に移す先のマスを選ぶ。移す先にも紋章があれば入れ替わる。ルーンはそのまま。（${MOVE_MOD_COST} G）`,place:'手持ちのルーンを押して選び、置きたいマスか予備を押す。置いたあとも、ルーン同士を押して入れ替えられる。手持ちを全部置くと完了できる。',arrange:'ルーンを押して選び、移したいマスか予備を押すと入れ替わる。',placeMod:`${S.pendingMod?MODS[S.pendingMod].n+'：'+MODS[S.pendingMod].d:''}。すでに紋章のあるマスは上書きされる。`,upgrade:'ルーンを選ぶと、いまの効果と強化後を見比べられる。強化済みのルーンは暗く表示される。',remove:'処分したルーンは戻らない。',discard:'新しいルーンか、持っているルーンから1つ選んで手放す。'};
  let b=`<div class="board" style="--n:${N}">`;
  for(let i=0;i<N*N;i++){
    const cell=r.board[i];const isSel=sel&&sel.loc==='b'&&sel.i===i||(m==='moveMod'&&S.ui.sel2===i);
    const base=runeTile(cell.r,{loc:'b',i},(isSel?'sel':'')+(m==='upgrade'&&cell.r&&cell.r.up?' ng':''));
    b+=cell.m?base.replace('</button>',`<span class="mod">${MODS[cell.m].s}</span></button>`):base;
  }
  b+='</div>';
  const rs=`<div class="reserve">${r.reserve.map((x,i)=>runeTile(x,{loc:'r',i},(sel&&sel.loc==='r'&&sel.i===i?'sel':'')+(m==='upgrade'&&x&&x.up?' ng':''))).join('')}</div>`;
  const tray=m==='place'?`<p class="label">手持ち（まだ置いていないルーン）</p>${trayLeft()?`<div class="reserve">${(r.tray||[]).map((x,i)=>x?runeTile(x,{loc:'t',i},sel&&sel.loc==='t'&&sel.i===i?'sel':''):'').join('')}</div>`:'<p class="small muted">すべて置いた。</p>'}`:'';
  const pend=m==='discard'&&S.pendingRune?`<p class="label">新しいルーン</p><div class="reserve">${runeTile(S.pendingRune,{loc:'p',i:0},sel&&sel.loc==='p'?'sel':'')}</div>`:'';
  const selInst=m==='moveMod'?null:instAt(sel);const selCell=sel&&sel.loc==='b'?r.board[sel.i]:null;
  const info=m==='moveMod'?(sel?`<p class="small" style="color:var(--gold)">${MODS[r.board[sel.i].m].n}：${MODS[r.board[sel.i].m].d}</p><p class="small muted">${S.ui.sel2==null?'移す先のマスを選ぶ':`${Math.floor(S.ui.sel2/N)+1}行${S.ui.sel2%N+1}列へ移す`+(r.board[S.ui.sel2].m?`（そこの${MODS[r.board[S.ui.sel2].m].n}と入れ替え）`:'')}</p>`:''):m==='upgrade'&&selInst&&!selInst.up?upgradeCompare(selInst):infoBlock(selInst,selCell);
  let actions='';
  if(m==='arrange')actions=`<button class="btn primary wide" data-a="editdone">完了</button>`;
  else if(m==='place'){const n=trayLeft();actions=`<div class="row">${n?`<button class="btn ghost" data-a="autoplace">残りをおまかせで置く</button>`:''}<button class="btn primary" style="margin-left:auto" data-a="editdone" ${n?'disabled':''}>${n?`あと${n}個`:'完了'}</button></div>`}
  else{
    const lab={moveMod:'紋章を移す',placeMod:'このマスに刻む',upgrade:'このルーンを強化する',remove:'このルーンを処分する',discard:'これを手放す'}[m];
    let ok=!!sel;if(m==='upgrade'&&selInst&&selInst.up)ok=false;if(m!=='placeMod'&&m!=='moveMod'&&!selInst)ok=false;if(m==='moveMod')ok=!!sel&&S.ui.sel2!=null;
    actions=`<div class="row">${S.cancel?`<button class="btn ghost" data-a="editcancel">やめる</button>`:''}<button class="btn primary" style="margin-left:auto" data-a="editok" ${ok?'':'disabled'}>${lab}</button></div>`;
    if(m==='upgrade'&&selInst&&selInst.up)actions+=`<p class="small muted">このルーンは強化済み。</p>`;
  }
  return `<div class="panel"><h2>${T[m]}</h2>${S.editNote?`<p style="color:var(--gold)">${S.editNote}</p>`:''}<p class="small muted">${SUB[m]}</p>${S.ui.err?`<p class="small" style="color:var(--hp)">${S.ui.err}</p>`:''}</div>
  ${tray}
  ${m==='place'?'<p class="label">魔法陣</p>':''}${b}
  <p class="label">予備（戦闘では使えない）</p>${rs}
  ${pend}
  <div class="panel info">${info||'<p class="muted">ルーンかマスを選ぶと、ここに説明が出る。</p>'}</div>
  ${actions}`;
}

/* ============ 操作 ============ */
$app.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-a]');if(!t||t.disabled)return;
  const a=t.dataset.a,d=t.dataset;const r=S.run;
  switch(a){
    case 'totitle':S.ui.relicInfo=null;S.ui.flash='';if(NET.code)netLeave();goto('title');break;
    case 'toonline':NET.err='';goto('online');break;
    case 'netcreate':netOpen(true);break;
    case 'netjoin':netOpen(false);break;
    case 'netleave':netLeave();goto('title');break;
    case 'netready':S.ui.netReady=!S.ui.netReady;sendMe();render();break;
    case 'openlocal':location.href='http://localhost:8080/?server='+encodeURIComponent(location.origin)+(S.ui.code?'&code='+encodeURIComponent(S.ui.code):'');break;
    case 'netchar':if(netCharOk(d.k)){S.ui.char=d.k;sendMe();render()}break;
    case 'netcurse':if(NET.host&&NET.st){const maxC=meta.maxCurse;const cv=Math.max(0,Math.min(maxC,NET.st.curse+Number(d.d)));NET.st.curse=cv;render();post('settings',{curse:cv})}break;
    case 'netstart':netStart();break;
    case 'vote':netVote(d.k);break;
    case 'netreset':post('reset');break;
    case 'tochars':goto('chars');break;
    case 'tocodex':goto('codex');break;
    case 'torecords':goto('records');break;
    case 'rlv':S.ui.rlv=d.k;render();break;
    case 'askreset':S.ui.flash='';S.ui.confirm=true;render();break;
    case 'noreset':S.ui.confirm=false;render();break;
    case 'doreset':resetAll();S.ui.confirm=false;S.ui.flash='データを初期化しました。';render();break;
    case 'ctab':S.ui.ctab=d.k;render();break;
    case 'continue':{S.run=load(RK);if(!S.run)return render();allRunes().forEach(x=>{x.inst.id=fixId(x.inst.id)});if(S.run.shop)S.run.shop.runes.forEach(it=>{it.id=fixId(it.id)});if(S.run.tray)S.run.tray.forEach(x=>{if(x)x.id=fixId(x.id)});S.ui.relicInfo=null;const resume=()=>{if(S.run.pending)startNode(S.run.pending);else goto('map')};if(trayLeft())openPlace(resume,'置いていないルーンがある。置く場所を選ぼう');else{S.run.tray=null;resume()}}break;
    case 'pickchar':S.ui.char=d.k;render();break;
    case 'curse':S.ui.curse=Math.max(0,S.ui.curse+Number(d.d));render();break;
    case 'start':S.ui.relicInfo=null;newRun(S.ui.char,S.ui.curse);break;
    case 'relicinfo':S.ui.relicInfo=S.ui.relicInfo===d.k?null:d.k;render();break;
    case 'node':S.ui.relicInfo=null;if(!r.online)chooseNode(d.k);break;
    case 'arrange':openEdit('arrange',()=>{saveRun();goto(S.run&&S.run.online?netHome():'map')});break;
    case 'askabandon':S.ui.confirm=true;render();break;
    case 'noabandon':S.ui.confirm=false;render();break;
    case 'abandon':endRun(false);break;
    // 戦闘
    case 'cast':cast(d.k,Number(d.i));break;
    case 'endturn':endTurn();break;
    case 'rev':if(!S.cb.revUsed){S.cb.rev=!S.cb.rev;render()}break;
    case 'target':S.cb.target=Number(d.i);render();break;
    case 'swap':if(S.cb&&!S.cb.swapUsed&&!S.cb.busy&&(!S.cb.online||myTurn())){S.cb.swap=S.cb.swap?null:{first:null};render()}break;
    case 'cinfo':{
      const i=Number(d.i),c=S.cb;
      if(c.swap&&!c.busy&&(!c.online||myTurn())){
        if(c.sealed[i]>0){c.info=i;render();break}
        if(c.swap.first==null){if(r.board[i].r)c.swap.first=i;render();break}
        if(c.swap.first===i){c.swap.first=null;render();break}
        const a=c.swap.first,ra=r.board[a].r;r.board[a].r=r.board[i].r;r.board[i].r=ra;
        c.swap=null;c.swapUsed=true;fx('c',a,'','mod');fx('c',i,'','mod');log('ルーンを植え替えた');if(c.online){pushMe();emitC()}render();break;
      }
      c.info=c.info===i?null:i;render()}break;
    // 報酬
    case 'pickrune':if(!hasSpace())break;S.queue.shift();give(d.k,contQueue);break;
    case 'skip':S.queue.shift();contQueue();break;
    case 'pickmod':S.queue.shift();S.pendingMod=d.k;openEdit('placeMod',contQueue);break;
    case 'pickrelic':S.queue.shift();addRelic(d.k);contQueue();break;
    case 'doexpand':S.queue.shift();expandBoard();openEdit('arrange',contQueue,null,`魔法陣が${r.N}×${r.N}に広がった`);break;
    // 編集
    case 'slot':{
      S.ui.err=null;const loc=d.loc,i=Number(d.i),m=S.editMode,sel=S.ui.sel;const here={loc,i};
      if(m==='arrange'||m==='place'){
        if(loc==='p'||(loc==='t'&&m!=='place'))break;
        const fromTray=sel&&sel.loc==='t';
        if(sel&&sel.loc===loc&&sel.i===i)S.ui.sel=null;
        else if(sel){const ia=instAt(sel),ib=instAt(here);setAt(sel,ib);setAt(here,ia);S.ui.sel=null;
          if(m==='place'&&fromTray){const k=(r.tray||[]).findIndex(Boolean);if(k>=0)S.ui.sel={loc:'t',i:k}}}
        else if(instAt(here))S.ui.sel=here;
      }else if(m==='placeMod'){if(loc==='b')S.ui.sel=here}
      else if(m==='moveMod'){if(loc!=='b')break;
        if(!sel){if(r.board[i].m)S.ui.sel=here;else S.ui.err='まず、紋章のあるマスを選ぶ'}
        else if(sel.i===i){S.ui.sel=null;S.ui.sel2=null}
        else S.ui.sel2=S.ui.sel2===i?null:i}
      else if(instAt(here))S.ui.sel=here;
      render();
    }break;
    case 'autoplace':flushTray();S.ui.sel=null;saveRun();render();break;
    case 'editdone':{if(S.editMode==='place'&&trayLeft())break;const f=S.after;S.after=null;S.ui.sel=null;f()}break;
    case 'editcancel':{const f=S.cancel;S.cancel=null;S.after=null;S.ui.sel=null;S.ui.sel2=null;S.pendingMod=null;f()}break;
    case 'editok':{
      const m=S.editMode,sel=S.ui.sel;if(!sel)break;
      if(m==='moveMod'){if(S.ui.sel2==null)break;const a=r.board[sel.i],b=r.board[S.ui.sel2];[a.m,b.m]=[b.m||null,a.m];r.gold-=MOVE_MOD_COST;r.shop.modMoved=true;S.ui.sel2=null}
      else if(m==='placeMod'){r.board[sel.i].m=S.pendingMod;S.pendingMod=null}
      else if(m==='upgrade'){const x=instAt(sel);if(x)x.up=true}
      else if(m==='remove'){setAt(sel,null);r.gold-=60;r.shop.removed=true}
      else if(m==='discard'){if(sel.loc!=='p')setAt(sel,S.pendingRune);S.pendingRune=null}
      const f=S.after;S.after=null;S.cancel=null;S.ui.sel=null;saveRun();f();
    }break;
    // 施設
    case 'rest':r.hp=Math.min(r.maxHp,r.hp+Math.round(r.maxHp*0.3*(has('boots')?1.5:1)));finishNode();break;
    case 'campup':openEdit('upgrade',finishNode,()=>goto('camp'));break;
    case 'buyrune':{const it=r.shop.runes[Number(d.i)];if(it.sold||r.gold<it.p||!hasSpace())break;r.gold-=it.p;it.sold=true;saveRun();give(it.id,()=>{saveRun();goto('shop')})}break;
    case 'buyrelic':{const it=r.shop.relics[Number(d.i)];if(it.sold||r.gold<it.p)break;r.gold-=it.p;it.sold=true;addRelic(it.id);saveRun();render()}break;
    case 'buymod':{const it=r.shop.mod;if(it.sold||r.gold<it.p)break;r.gold-=it.p;it.sold=true;S.pendingMod=it.id;saveRun();openEdit('placeMod',()=>{saveRun();goto('shop')})}break;
    case 'shopmovemod':if(r.shop.modMoved||r.gold<MOVE_MOD_COST||!r.board.some(c=>c.m))break;S.ui.sel2=null;openEdit('moveMod',()=>{saveRun();goto('shop')},()=>goto('shop'));break;
    case 'shopremove':openEdit('remove',()=>{saveRun();goto('shop')},()=>goto('shop'));break;
    case 'leave':finishNode();break;
    case 'evchoice':{const ev=EVENTS.find(e=>e.id===r.ev);const c=ev.ch[Number(d.i)];if(c.ok&&!c.ok())break;S.evResult=c.f();saveRun();render()}break;
    case 'evnext':{const res=S.evResult;S.evResult=null;
      if(res.give)give(res.give,finishNode);
      else if(res.upgrade)openEdit('upgrade',finishNode);
      else if(res.mod){S.pendingMod=res.mod;openEdit('placeMod',finishNode)}
      else finishNode();
    }break;
  }
});

/* ============ オンライン協力プレイ（サーバー版） ============ */
// オンライン大富豪と同じ方式：server.js が部屋と進行を持ち、ブラウザは定期的に状態を取りに行く（ポーリング）。
// 行き先は全員の投票で決め、割れたら票数に比例したルーレットで決まる（サーバーが抽選）。
// 戦闘は1人ずつ順番に詠唱し、今動いている人だけが戦闘の状態を送れる。
const NET={base:'',mode:'checking',code:'',me:null,token:'',st:null,cs:null,turnKey:'',enemyKey:'',startedKey:'',mapKey:'',doneKey:null,finished:{},err:'',timer:null,busyPoll:false,sig:'',lastMe:'',recvAt:0,creating:'',ended:false};
const ONLINE_ATK=0.25; // 1人増えるごとの魔物の攻撃の上乗せ（HPは人数倍）
const SPIN_MS=4200;
const NODE_COLOR={battle:'var(--hp)',elite:'#b4473f',camp:'var(--forest)',shop:'var(--gold)',event:'var(--star)',treasure:'var(--thunder)',boss:'#8e3a3a'};
try{S.ui.nick=localStorage.getItem('runecircle_nick')||''}catch(e){S.ui.nick=''}

// サーバーから開かれているかを確認
(async()=>{
  if(location.protocol==='file:'){NET.mode='file'}
  else{
    try{const r=await fetch('/api/ping',{cache:'no-store'});const j=await r.json();NET.mode=j&&j.app==='runecircle'?'server':'none';NET.hosted=!!(j&&j.hosted)}catch(e){NET.mode='none'}
  }
  // フォルダへのセーブは、配布フォルダのサーバーで遊ぶときだけ。公開サイトやこのページの共有版ではブラウザにだけ保存する
  if(NET.mode==='file'||(NET.mode==='server'&&!NET.hosted))localSaveInit();else{LOCAL.state='off';if(['title','online'].includes(S.screen))render()}
  // 「自分のゲームで開く」から来たとき：ホストのURLと部屋コードを入れておく
  try{const q=new URLSearchParams(location.search);const sv=q.get('server');if(sv){S.ui.hostUrl=sv;S.ui.code=(q.get('code')||'').toUpperCase().slice(0,4);history.replaceState(null,'',location.pathname);if(NET.mode==='server'&&S.screen==='title')return goto('online')}}catch(e){}
  if(S.screen==='title'||S.screen==='online')render();
})();
const isLocalPage=()=>{try{return /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)}catch(e){return false}};
// 入力されたホストのURLを、接続先（オリジン）にする
function hostBase(s){s=String(s||'').trim();if(!s)return '';if(!/^https?:\/\//i.test(s))s='http://'+s;try{const u=new URL(s);return u.origin===location.origin?'':u.origin}catch(e){return null}}

async function api(method,url,body){
  try{
    const r=await fetch(NET.base+url,{method,headers:body?{'Content-Type':NET.base?'text/plain':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,cache:'no-store'});
    let j={};try{j=await r.json()}catch(e){}
    return{status:r.status,json:j};
  }catch(e){return{status:0,json:{error:'サーバーにつながりません'}}}
}
const post=(act,data)=>api('POST',`/api/room/${NET.code}/${act}`,Object.assign({playerId:NET.me,token:NET.token},data||{}));

const isCombatNode=t=>t==='battle'||t==='elite'||t==='boss';
const plOf=p=>NET.st&&NET.st.players.find(x=>x.id===p);
const present=p=>{const x=plOf(p);return !!(x&&x.online&&!x.left)};
const nickOf=p=>{const x=plOf(p);return esc((x&&x.name)||(NET.cs&&NET.cs.pl[p]&&NET.cs.pl[p].nick)||'？')};
const netHome=()=>NET.st&&NET.st.stage==='map'?'map':'wait';
Object.defineProperty(NET,'host',{get(){return !!(NET.st&&NET.st.hostId===NET.me)}});
Object.defineProperty(NET,'hostPeer',{get(){return NET.st?NET.st.hostId:null}});

/* --- 部屋に入る・出る --- */
async function netOpen(host){
  NET.err='';
  if(NET.mode!=='server'){NET.err='サーバーにつながっていません。';return render()}
  const name=String(S.ui.nick||'').trim();
  if(!name){NET.err='名前を入力してください。';return render()}
  if(!charUnlocked(S.ui.char))S.ui.char='apprentice';
  let res;
  if(host){NET.base='';res=await api('POST','/api/room',{name,char:S.ui.char})}
  else{
    const code=String(S.ui.code||'').trim().toUpperCase();
    if(!/^[A-Z0-9]{4}$/.test(code)){NET.err='4文字の部屋コードを入力してください。';return render()}
    const base=isLocalPage()?hostBase(S.ui.hostUrl):'';
    if(base===null){NET.err='ホストのURLが正しくありません。';return render()}
    NET.base=base;
    if(base){const pg=await api('GET','/api/ping');if(pg.status!==200||!pg.json||pg.json.app!=='runecircle'){NET.base='';NET.err='そのURLのサーバーにつながりません。URLと、ホストのサーバーが動いているかを確かめてください。';return render()}}
    res=await api('POST',`/api/room/${code}/join`,{name,char:S.ui.char});
  }
  if(res.status!==200){NET.err=res.json.error||'部屋に入れませんでした。';return render()}
  Object.assign(NET,{code:res.json.code,me:res.json.playerId,token:res.json.token,st:null,cs:null,turnKey:'',enemyKey:'',startedKey:'',mapKey:'',doneKey:null,finished:{},sig:'',lastMe:'',creating:'',ended:false});
  S.ui.netReady=false;

}
function netLeave(){

  clearInterval(NET.timer);
  Object.assign(NET,{base:'',code:'',me:null,token:'',st:null,cs:null,err:'',doneKey:null,startedKey:'',mapKey:'',sig:''});

async function netPoll(){
  if(!NET.code||NET.busyPoll)return;

  const res=await api('GET',`/api/room/${NET.code}?playerId=${NET.me}`);
  NET.busyPoll=false;

  if(res.status===404){NET.err='部屋がなくなりました（サーバーが止まったか、長く使われていなかった可能性があります）。';clearInterval(NET.timer);render();return}
  if(res.status!==200||!res.json.room){if(res.status===0&&!/つながりません/.test(NET.err)){NET.err='サーバーにつながりません。通信が戻ると自動で再開します。';render()}return}
  if(/つながりません/.test(NET.err))NET.err='';

  applyState(res.json.room);
  sendMe();
}
function sendMe(){
  if(!NET.code)return;const r=S.run;
  const patch={char:S.ui.char,ready:!!S.ui.netReady,hp:r?Math.max(0,r.hp):0,max:r?r.maxHp:0,lantern:has('lantern')};

}

/* --- サーバーの状態を画面に反映 --- */
function stateSig(st){return JSON.stringify([st.rev,st.players.map(p=>[p.online,p.done,p.ready,p.char,p.hp]),st.hostId])}
function applyState(st){
  const prevSig=NET.sig;NET.st=st;NET.sig=stateSig(st);const changed=prevSig!==NET.sig;
  const meP=st.players.find(p=>p.id===NET.me);
  if(!meP){NET.err='部屋から外れました。';clearInterval(NET.timer);render();return}
  if(st.phase==='lobby'){
    if(S.run&&S.run.online){S.run=null;S.cb=null}
    NET.ended=false;
    if(S.screen!=='lobby')goto('lobby');else if(changed)render();
    return;
  }
  if(!meP.inGame){NET.err='このゲームはすでに始まっているため、途中からは参加できません。';if(S.screen!=='lobby')goto('lobby');else if(changed)render();return}
  if(st.stage==='end'){
    if(S.run&&S.run.online&&!NET.ended){NET.ended=true;endRun(st.result==='win')}
    else if(changed&&S.screen==='end')render();
    return;
  }
  if(!S.run||!S.run.online){makeRun(S.ui.char,st.curse,true);meta.runs++;saveMeta();beginSetup(()=>goto(netHome()))}
  const r=S.run;if(st.bossSeed)r.bosses=pickBosses(st.bossSeed);
  if(st.stage==='map'){
    const key=st.act+'-'+st.floor;
    if(NET.mapKey!==key){
      NET.mapKey=key;r.act=st.act;r.floor=st.floor;r.opts=st.opts;NET.doneKey=null;NET.cs=null;
      if(S.cb&&S.cb.online&&S.screen==='combat')S.cb=null;
      if(r.act>=1&&!meta.reached2){meta.reached2=true;saveMeta()}
      if(S.screen!=='edit')goto('map');
    }else if(changed&&S.screen==='map')render();
    return;
  }
  if(st.stage==='node'){
    const key=st.nodeKey;r.act=st.act;r.floor=st.floor;
    if(NET.startedKey!==key){
      NET.startedKey=key;NET.doneKey=null;
      if(isCombatNode(st.node)){if(!(S.cb&&S.cb.online))goto('wait')}
      else{r.pending=st.node;if(st.node==='event')r.ev=EVENTS[(st.evSeed>>>0)%EVENTS.length].id;startNode(st.node)}
    }
    if(isCombatNode(st.node)){
      const cs=st.cs;
      if(cs&&cs.nodeKey===key)adoptFromServer(cs);
      else if(NET.host&&NET.creating!==key&&!(NET.cs&&NET.cs.nodeKey===key)){NET.creating=key;hostStartCombat(st.node)}
      if(NET.host)hostTick();
    }
    if(changed&&S.screen==='wait')render();
  }
}

/* --- ロビー・投票 --- */
function netStart(){post('start').then(res=>{if(res.status!==200){NET.err=res.json.error||'始められませんでした。';render()}})}

/* --- 戦闘 --- */
function hostStartCombat(kind){
  const st=NET.st;const order=st.players.filter(p=>p.inGame&&p.online&&!p.left).map(p=>p.id);
  if(!order.length)return;
  const n=order.length;const enemies=makeEnemies(kind,n);const pl={};
  for(const p of order){
    const x=plOf(p),mine=p===NET.me;
    pl[p]={nick:String(x.name||'？').slice(0,10),char:mine?S.run.char:x.char,hp:mine?S.run.hp:(x.hp||1),max:mine?S.run.maxHp:(x.max||60),block:0,poison:0,weak:0,power:0,thorns:0,down:false,seal:0,lantern:mine?has('lantern'):!!x.lantern};
  }
  enemies.forEach(e=>{e.tg=pick(order)});
  NET.cs={id:'c'+Date.now().toString(36)+Math.floor(Math.random()*1e4),seq:1,nodeKey:st.nodeKey,kind,round:1,n,order,ai:0,auth:order[0],phase:'p',enemies,pl};
  setupLocalCombat(NET.cs);post('cs',{cs:NET.cs});processCs();
}
function adoptFromServer(cs){
  if(NET.finished[cs.id])return;
  if(NET.cs&&NET.cs.id===cs.id&&!(cs.seq>NET.cs.seq))return;
  adoptCs(cs);
}
function setupLocalCombat(cs){
  flushTray();const r=S.run;allRunes().forEach(x=>{x.inst.g=0});
  cs.enemies.forEach(e=>{meta.seen.mons[e.id]=1});saveMeta();
  S.cb={id:cs.id,online:true,kind:cs.kind,enemies:cs.enemies,turn:cs.round,mana:0,used:{r:Array(r.N).fill(0),c:Array(r.N).fill(0)},block:0,poison:0,weak:0,power:0,thorns:0,sealed:Array(r.N*r.N).fill(0),once:{},rev:false,revUsed:true,target:0,busy:false,hl:-1,info:null,fxq:[],log:[]};
  combatStartRelics();
  r.pending=null;syncMeFromCs();goto('combat');
}
function syncMeFromCs(){const cs=NET.cs,c=S.cb;if(!cs||!c)return;const p=cs.pl[NET.me];if(!p)return;c.block=p.block;c.poison=p.poison;c.weak=p.weak;c.power=p.power;c.thorns=p.thorns;S.run.hp=p.hp}
function pushMe(){const cs=NET.cs,c=S.cb;if(!cs||!c)return;const p=cs.pl[NET.me];if(!p)return;Object.assign(p,{block:c.block,poison:c.poison,weak:c.weak,power:c.power,thorns:c.thorns,hp:Math.max(0,S.run.hp),mana:c.mana,bd:boardSnap()});if(S.run.hp<=0)p.down=true}
// 仲間に見せる自分の魔法陣（ルーン名・強化・成長・紋章・封印）
function boardSnap(){const r=S.run,c=S.cb;return{N:r.N,c:r.board.map((cl,i)=>cl.r||cl.m?[cl.r?cl.r.id:0,cl.r&&cl.r.up?1:0,cl.r?cl.r.g:0,cl.m||0,c&&c.sealed[i]>0?1:0]:0)}}
// 他の人の番のとき、その人の魔法陣を表示する
function viewing(){
  const cs=NET.cs,c=S.cb;if(!c||!c.online||!cs||cs.id!==c.id)return null;
  const pid=S.replay?S.replay.pid:(cs.phase==='p'&&cs.auth!==NET.me?cs.auth:null);if(!pid)return null;
  const P=cs.pl[pid];if(!P||!P.bd)return null;
  const cells=P.bd.c.map(x=>x?{r:x[0]&&RUNES[x[0]]?{id:x[0],up:!!x[1],g:x[2]||0}:null,m:x[3]||null,sl:!!x[4]}:{r:null,m:null,sl:false});
  return{pid,nick:P.nick,char:P.char,mana:S.replay?null:P.mana,N:P.bd.N,cells};
}
// 仲間の詠唱を再生する
async function playReplay(rec,before){
  const cs=NET.cs,c=S.cb;if(!c)return;const P=cs.pl[rec.pid];const nick=P?P.nick:'？';
  S.replay={pid:rec.pid,hl:-1,cur:before?{hp:before.map(e=>e.hp),bl:before.map(e=>e.block)}:null};
  log(`${nick}が${rec.k==='r'?rec.idx+1+'行目':rec.idx+1+'列目'}を${rec.rev?'逆から':''}詠唱`);render();
  for(const st of rec.steps){
    if(!S.replay||S.cb!==c||myTurn())break;
    S.replay.hl=st.i;render();await sleep(200);if(!S.replay||S.cb!==c)break;
    S.replay.cur=st;st.fx.forEach(f=>c.fxq.push(f.k==='p'?{...f,k:'q',i:rec.pid}:f));render();await sleep(160);
  }
  if(S.cb===c){(rec.log||[]).forEach(l=>log(`${nick}：${l}`));S.replay=null;render()}
}
function emitC(){const cs=NET.cs;if(!cs)return;cs.seq++;post('cs',{cs:JSON.parse(JSON.stringify(cs))})}
const allDown=()=>{const cs=NET.cs;return cs.order.every(p=>cs.pl[p].down||!present(p))};
const myTurn=()=>!!(NET.cs&&S.cb&&S.cb.online&&NET.cs.id===S.cb.id&&NET.cs.phase==='p'&&NET.cs.auth===NET.me);
function adoptCs(cs){
  const old=NET.cs;NET.cs=cs;
  if(!S.cb||S.cb.id!==cs.id){if(!S.run)return;setupLocalCombat(cs)}
  else{S.cb.enemies=cs.enemies;const rp=cs.cast&&cs.cast.pid!==NET.me&&NET.castSeen!==cs.cast.id;if(old&&old.id===cs.id&&!rp)diffFloats(old,cs);syncMeFromCs();
    if(rp){NET.castSeen=cs.cast.id;playReplay(cs.cast,old&&old.id===cs.id?old.enemies:null)}}
  processCs();if(!S.cb.busy)render();
}
function diffFloats(o,n){
  n.enemies.forEach((e,i)=>{const a=o.enemies[i];if(!a)return;const d=e.hp-a.hp;if(d<0)fx('e',i,String(d),'dmg');else if(d>0)fx('e',i,'+'+d,'heal')});
  for(const p of n.order){const a=o.pl[p],b=n.pl[p];if(!a||!b)continue;const d=b.hp-a.hp;if(!d)continue;const t=d<0?String(d):'+'+d,cls=d<0?'pdmg':'heal';if(p===NET.me)fx('p',0,t,cls);else fx('q',p,t,cls)}
}
function processCs(){
  const cs=NET.cs;if(!cs||!S.cb||S.cb.id!==cs.id)return;
  if(cs.phase==='win'){if(!NET.finished[cs.id]){NET.finished[cs.id]=1;setTimeout(onlineWin,500)}return}
  if(cs.phase==='lose'){if(!NET.finished[cs.id]){NET.finished[cs.id]=1;setTimeout(()=>{if(S.run&&S.run.online&&!NET.ended){NET.ended=true;post('finish',{win:false});endRun(false)}},700)}return}
  if(cs.phase==='p'&&cs.auth===NET.me){const key=cs.id+':'+cs.round+':'+cs.ai;if(NET.turnKey!==key){NET.turnKey=key;startMyTurn()}}
  if(cs.phase==='e'&&NET.host&&cs.auth===NET.me){const key=cs.id+':'+cs.round;if(NET.enemyKey!==key){NET.enemyKey=key;hostEnemyPhase()}}
}
function hostTick(){
  const cs=NET.cs;if(!NET.host||!cs||!S.cb||S.cb.id!==cs.id||S.cb.busy)return;
  if(cs.phase==='p'&&cs.auth!==NET.me&&!present(cs.auth)){cs.pl[cs.auth].down=true;passTurn();return}
  if(cs.phase==='e'&&cs.auth!==NET.me&&!present(cs.auth)){cs.auth=NET.me;emitC();processCs()}
}
function startMyTurn(){
  S.replay=null;const cs=NET.cs,c=S.cb,r=S.run,N=r.N,p=cs.pl[NET.me];
  if(!p||p.down)return passTurn();
  c.turn=cs.round;r.stats.turns++;
  c.block=(cs.round===1&&has('hat')?8:0)+(has('iron')?3:0);
  c.mana=3+(has('crystal')?1:0)+(cs.round===1&&has('hourglass')?2:0);
  c.used={r:Array(N).fill(0),c:Array(N).fill(0)};c.once={};c.thorns=has('thornc')?2:0;c.rev=false;c.revUsed=false;c.swap=null;c.swapUsed=false;c.busy=false;
  c.poison=p.poison;c.weak=p.weak;c.power=p.power;
  if(has('amulet')){c.poison=Math.max(0,c.poison-2);c.weak=Math.max(0,c.weak-1)}
  if(cs.round===1&&!c.firstDone){c.firstDone=true;firstTurnRelics(cs.enemies)}
  if(p.seal>0){const cand=r.board.map((cl,i)=>cl.r&&c.sealed[i]<1?i:-1).filter(i=>i>=0);for(const i of shuffle(cand).slice(0,p.seal)){c.sealed[i]=1;fx('c',i,'封印','info')}log('ルーンが封印された');p.seal=0}
  pushMe();emitC();render();
}
function passTurn(){
  const cs=NET.cs;if(!cs)return;
  let k=cs.ai+1;while(k<cs.order.length&&(cs.pl[cs.order[k]].down||!present(cs.order[k])))k++;
  if(k<cs.order.length){cs.ai=k;cs.auth=cs.order[k]}else{cs.phase='e';cs.auth=NET.hostPeer||cs.order[0]}
  emitC();processCs();render();
}
function afterOnlineCast(){
  const cs=NET.cs;pushMe();
  if(allDead()){cs.phase='win';emitC();processCs();render();return}
  if(cs.pl[NET.me].down){if(allDown()){cs.phase='lose';emitC();processCs();render();return}return passTurn()}
  emitC();render();
  // マナが尽きたら自動でターン終了
  const c=S.cb;if(c&&c.mana<1)setTimeout(()=>{if(S.cb===c&&!c.busy&&c.mana<1&&myTurn()&&S.screen==='combat')endTurn()},450);
}
function endTurnOnline(){
  const c=S.cb,r=S.run;if(c.busy||!myTurn())return;
  c.info=null;c.rev=false;
  if(c.poison>0){r.hp-=c.poison;fx('p',0,'毒 -'+c.poison,'pdmg');c.poison--}
  c.weak=Math.max(0,c.weak-1);c.sealed=c.sealed.map(v=>Math.max(0,v-1));c.mana=0;
  pushMe();const cs=NET.cs;
  if(cs.pl[NET.me].down&&allDown()){cs.phase='lose';emitC();processCs();render();return}
  passTurn();
}
async function hostEnemyPhase(){
  const cs=NET.cs,c=S.cb;if(!c)return;
  c.busy=true;
  for(const e of cs.enemies){if(e.hp>0&&e.burn>0){e.hp=Math.max(0,e.hp-e.burn);fx('e',cs.enemies.indexOf(e),'-'+e.burn,'burn');e.burn--}}
  cs.enemies.forEach(e=>{e.vuln=Math.max(0,e.vuln-1)});
  emitC();render();
  if(allDead()){c.busy=false;cs.phase='win';emitC();processCs();return}
  await sleep(450);
  for(const e of [...cs.enemies]){
    if(e.hp<=0)continue;if(NET.cs!==cs){c.busy=false;return}
    enemyPre(e,cs.enemies);shake(`[data-eid="${cs.enemies.indexOf(e)}"]`);
    for(const a of MON[e.id].mv[e.mi]){await enemyActOnline(e,a);if(allDown()||e.hp<=0)break}
    e.mi=(e.mi+1)%MON[e.id].mv.length;e.weak=Math.max(0,e.weak-1);
    syncMeFromCs();emitC();render();
    if(allDown()){c.busy=false;cs.phase='lose';emitC();processCs();return}
    if(allDead()){c.busy=false;cs.phase='win';emitC();processCs();return}
    await sleep(300);
  }
  cs.round++;
  const alivePl=cs.order.filter(p=>!cs.pl[p].down&&present(p));
  cs.enemies.forEach(e=>{if(e.hp<=0)return;if(MON[e.id].immune)e.immune=pick(Object.keys(EL));e.tg=pick(alivePl)});
  const k=cs.order.findIndex(p=>!cs.pl[p].down&&present(p));cs.ai=k;cs.auth=cs.order[k];cs.phase='p';
  c.busy=false;emitC();processCs();render();
}
async function enemyActOnline(e,a){
  const cs=NET.cs,ei=cs.enemies.indexOf(e);
  let tg=e.tg;
  if(!cs.pl[tg]||cs.pl[tg].down||!present(tg)){const al=cs.order.filter(p=>!cs.pl[p].down&&present(p));if(!al.length)return;tg=e.tg=pick(al)}
  const P=cs.pl[tg],wk=tg===NET.me?'p':'q',wi=tg===NET.me?0:tg;
  switch(a.a){
    case 'atk':for(let k=0;k<a.x;k++){
      // 攻撃は、倒れていない全員に当たる
      const all=cs.order.filter(p=>!cs.pl[p].down&&present(p));if(!all.length)break;
      for(const id of all){
        const Q=cs.pl[id],qk=id===NET.me?'p':'q',qi=id===NET.me?0:id;
        const d=atkVal(e,a.v);const blk=Math.min(Q.block,d);Q.block-=blk;const dm=d-blk;Q.hp-=dm;fx(qk,qi,dm>0?'-'+dm:'防御','pdmg');
        if(Q.thorns>0&&e.hp>0){e.hp=Math.max(0,e.hp-Q.thorns);fx('e',ei,'反撃 -'+Q.thorns,'dmg')}
        if(Q.hp<=0){Q.hp=0;Q.down=true;log(`${Q.nick}が倒れた`)}
      }
      syncMeFromCs();render();await sleep(200);if(e.hp<=0)return}break;
    case 'block':{const v=sc(a.v,e);e.block+=v;fx('e',ei,'防御+'+v,'blk')}break;
    case 'str':e.str+=a.v;fx('e',ei,'力+'+a.v,'info');break;
    case 'poison':{const pv=sc(a.v,e);const v=P.lantern?Math.floor(pv/2):pv;P.poison+=v;fx(wk,wi,'毒+'+v,'info')}break;
    case 'weak':P.weak+=a.v;fx(wk,wi,'弱体+'+a.v,'info');break;
    case 'heal':{const v=sc(a.v,e);e.hp=Math.min(e.max,e.hp+v);fx('e',ei,'+'+v,'heal')}break;
    case 'healAll':{const v=sc(a.v,e);cs.enemies.filter(x=>x.hp>0).forEach(x=>{x.hp=Math.min(x.max,x.hp+v);fx('e',cs.enemies.indexOf(x),'+'+v,'heal')})}break;
    case 'seal':P.seal=(P.seal||0)+a.v;log(`${e.n}が${P.nick}のルーンを封印した`);break;
    case 'summon':{for(let k=0;k<a.n;k++)spawnEnemy(cs.enemies,a.id,e);log(`${e.n}が${MON[a.id].n}を呼んだ`)}break;
    case 'boom':case 'steal':{
      // 自爆・強奪の攻撃も全員に当たる（オンラインではゴールドは盗まれない）
      for(const id of cs.order.filter(p=>!cs.pl[p].down&&present(p))){const Q=cs.pl[id],qk=id===NET.me?'p':'q',qi=id===NET.me?0:id;
        const d=atkVal(e,a.v);const blk=Math.min(Q.block,d);Q.block-=blk;const dm=d-blk;Q.hp-=dm;fx(qk,qi,dm>0?'-'+dm:'防御','pdmg');if(Q.hp<=0){Q.hp=0;Q.down=true;log(`${Q.nick}が倒れた`)}}
      if(a.a==='boom'){e.hp=0;fx('e',ei,'自爆','dmg');log(`${e.n}が自爆した`)}}break;
    case 'flee':e.hp=0;e.fled=true;fx('e',ei,'逃走','info');log(`${e.n}は逃げ出した`);break;
    case 'blockAll':{const v=sc(a.v,e);cs.enemies.filter(x=>x.hp>0).forEach(x=>{x.block+=v;fx('e',cs.enemies.indexOf(x),'防御+'+v,'blk')})}break;
    case 'phase':e.intangible=true;fx('e',ei,'実体が消えた','info');break;
    case 'charge':fx('e',ei,'力をためている','info');break;
  }
  syncMeFromCs();emitC();render();await sleep(150);
}
function onlineWin(){
  if(!S.run||!S.cb||!S.cb.online)return;
  const r=S.run;if(r.hp<=0)r.hp=Math.max(1,Math.round(r.maxHp*0.25));
  if(S.cb.kind==='boss'&&r.act===2&&!NET.ended){NET.ended=true;post('finish',{win:true})}
  winCombat();
}

/* --- 画面 --- */
function partyCard(p,{act,down,line}){
  return `<div class="pm ${act?'act':''} ${down?'down':''}" data-pid="${esc(p)}"><b>${nickOf(p)}</b>${p===NET.me?' <span class="muted">（あなた）</span>':''}<br><span class="small muted num">${line}</span></div>`;
}
function netFoot(){
  return `${NET.err?`<p class="small" style="color:var(--hp)">${NET.err}</p>`:''}<div class="row end"><button class="btn ghost small" data-a="netleave">部屋を出る</button></div>`;
}
function rOnline(){
  const body=NET.mode==='checking'?'<p class="muted">接続を確認しています…</p>'
  :NET.mode==='file'?'<div class="panel confirm"><p><b>このファイルを直接開いても、オンラインでは遊べません。</b></p><p class="small">フォルダの <b>start.bat</b>（Macは <b>start-mac.command</b>）をダブルクリックしてサーバーを起動し、表示されたURLをブラウザで開いてください。</p></div>'
  :NET.mode==='none'?'<div class="panel confirm"><p><b>オンラインは配布用のサーバー版で遊べます。</b></p><p class="small">「ルーンサークル」フォルダの start.bat（Macは start-mac.command）でサーバーを起動し、表示されたURLを開いてください。ここでは一人用だけ遊べます。</p></div>'
  :`<div class="panel"><label class="label" for="nick">名前（仲間に表示される）</label><input id="nick" class="field" maxlength="10" value="${esc(S.ui.nick||'')}" autocomplete="off">
     <button class="btn primary wide" data-a="netcreate">部屋を作る（ホスト）</button></div>
   <div class="panel"><label class="label" for="code">部屋コードで参加</label><input id="code" class="field" maxlength="4" value="${esc(S.ui.code||'')}" autocomplete="off" placeholder="例：K7MQ" style="text-transform:uppercase">
     ${isLocalPage()?`<label class="label" for="hosturl" style="margin-top:8px">ホストのURL（ほかの人の部屋に入るとき）</label><input id="hosturl" class="field" value="${esc(S.ui.hostUrl||'')}" autocomplete="off" placeholder="例：https://〇〇.trycloudflare.com"><span class="small muted">ホストから送られたURLを入れる。自分のパソコンで作った部屋に入るときは空のまま。</span>`:''}
     <button class="btn wide" data-a="netjoin">参加する</button></div>
   ${!isLocalPage()&&!NET.hosted&&LOCAL.state!=='ok'?`<div class="panel"><p class="small"><b>ゲームのフォルダを持っている人へ</b></p><p class="small muted">自分の start.bat（Macは start-mac.command）を起動してから下のボタンを押すと、自分のパソコンのゲームからこの部屋に参加できる。進行度（キャラの解放・戦績・図鑑）が自分のフォルダに保存される。</p><button class="btn wide" data-a="openlocal">自分のフォルダのゲームで開く</button></div>`:''}`;
  return `<div class="spread"><h2>オンラインで遊ぶ</h2><button class="btn ghost" data-a="totitle">戻る</button></div>
  <div class="panel"><p>部屋に集まった仲間（最大4人）と、同じ道を進んで一緒に戦う。行き先は全員の投票で決まり、票が割れたら票数に比例したルーレットで決まる。戦闘では1人ずつ順番に詠唱する。魔物の攻撃は全員に当たる。報酬・商人・野営地・遺跡は各自で選ぶ。</p>
  <p class="small muted">人数が増えるほど魔物は強くなる。HPは人数倍、攻撃は1人増えるごとに+25%。倒れた仲間は戦闘に勝つとHP25%で復活し、全員が倒れると冒険が終わる。</p></div>
  ${body}
  <p class="small muted">${saveNote()}</p>
  ${NET.err?`<p class="small" style="color:var(--hp)">${NET.err}</p>`:''}`;
}
function rLobby(){
  const st=NET.st;
  if(!st)return `<div class="spread"><h2>オンラインの部屋</h2><button class="btn ghost" data-a="netleave">部屋を出る</button></div><p class="muted">部屋に接続しています…</p>${NET.err?`<p class="small" style="color:var(--hp)">${NET.err}</p>`:''}`;
  const peers=st.players.filter(p=>!p.left);const inGame=st.phase!=='lobby';
  const list=peers.map(p=>partyCard(p.id,{act:p.id===st.hostId||p.ready,down:!p.online,line:`${CHARS[p.char]?CHARS[p.char].n:''}・${!p.online?'切断':p.id===st.hostId?'ホスト':p.ready?'準備OK':'準備中'}`})).join('');
  const others=peers.filter(p=>p.id!==NET.me&&p.online);const allReady=others.every(p=>p.ready);
  const n=Math.max(1,peers.filter(p=>p.online).length);const maxC=meta.maxCurse;
  if(!inGame&&!netCharOk(S.ui.char)){S.ui.char='apprentice';setTimeout(sendMe,0)}
  const chars=Object.keys(CHARS).map(id=>`<button class="tab ${S.ui.char===id?'on':''}" data-a="netchar" data-k="${id}" ${netCharOk(id)&&!inGame?'':'disabled'}>${CHARS[id].n}</button>`).join('');
  const lockedNote=Object.keys(CHARS).filter(id=>!netCharOk(id)).map(id=>`${CHARS[id].n}（ホストが${CHARS[id].lockText.replace('すると解放','').replace('に到達','に到達')}していない）`).join('、');
  return `<div class="spread"><h2>オンラインの部屋</h2><button class="btn ghost" data-a="netleave">部屋を出る</button></div>
  <div class="panel"><span class="label">部屋コード</span><span class="code">${esc(NET.code)}</span><span class="small muted">このコードを仲間に伝えて、「部屋コードで参加」から入ってもらう。</span></div>
  <h3>参加者 ${peers.length}人</h3><div class="party">${list}</div>
  <div class="panel"><b>使う魔法使い</b><div class="tabs">${chars}</div><p class="small muted">使える属性：${CHARS[S.ui.char].els.map(e=>EL[e].n).join('・')}</p><p class="small muted">選べるキャラはホストの進行度に合わせている。${lockedNote?'まだ選べない：'+lockedNote:''}</p></div>
  ${NET.host?`<div class="panel"><div class="spread"><b>呪いLv</b><div class="stepper"><button class="btn" data-a="netcurse" data-d="-1" ${st.curse<=0||inGame?'disabled':''} aria-label="呪いLvを下げる">−</button><b class="num" style="font-size:18px">${st.curse}</b><button class="btn" data-a="netcurse" data-d="1" ${st.curse>=maxC||inGame?'disabled':''} aria-label="呪いLvを上げる">＋</button></div></div>
      <p class="small muted">いまの人数（${n}人）なら、魔物のHP ×${n}、攻撃 ×${(1+ONLINE_ATK*(n-1)).toFixed(2)}</p>
      <button class="btn primary wide" data-a="netstart" ${!allReady||inGame?'disabled':''}>${allReady?'冒険を始める':'全員の準備を待っています'}</button></div>`
    :`<div class="panel"><p class="small muted">呪いLv ${st.curse}（ホストが決める）</p><button class="btn ${S.ui.netReady?'':'primary'} wide" data-a="netready" ${inGame?'disabled':''}>${S.ui.netReady?'準備を取り消す':'準備OK'}</button></div>`}
  ${NET.err?`<p class="small" style="color:var(--hp)">${NET.err}</p>`:''}`;
}
function rWait(){
  const st=NET.st;if(!st||!S.run)return rLobby();
  const key=st.nodeKey;const fight=st.stage==='node'&&isCombatNode(st.node)&&!NET.doneKey;
  const list=st.players.filter(p=>p.inGame).map(p=>{const done=p.id===NET.me?NET.doneKey===key:p.done===key;return partyCard(p.id,{act:done,down:!p.online,line:`${!p.online?'切断':fight?'戦闘準備中':done?'完了':'選択中'}・HP ${p.id===NET.me?S.run.hp:p.hp}/${p.id===NET.me?S.run.maxHp:p.max}`})}).join('');
  return `${statusHead()}
  <div class="panel"><h2>${fight?'戦闘の準備中':'仲間を待っています'}</h2><p class="small muted">${fight?'まもなく戦闘が始まる。':'全員が終わると、次の階の行き先を投票する。'}</p></div>
  <div class="party">${list}</div>
  <button class="btn wide" data-a="arrange">魔法陣を組み替える</button>
  ${netFoot()}`;
}
/* マップ：投票とルーレット */
function onlineVoteUI(){
  const st=NET.st,r=S.run;if(!st||st.stage!=='map')return '';
  const v=st.vote,live=st.players.filter(p=>p.inGame&&p.online);
  const voted=live.filter(p=>v.votes[p.id]!==undefined).length;
  const mine=v.votes[NET.me];
  const opts=(r.opts||[]).map(t=>{
    const n=NODES[t];const name=t==='boss'?MON[bossOf(r.act)].n:n.n;const desc=t==='boss'?bossDesc(bossOf(r.act)):n.d;
    const who=live.filter(p=>v.votes[p.id]===t).map(p=>`<span class="chip">${esc(p.name)}</span>`).join('');
    return `<button class="opt k-${t} ${mine===t?'voted':''}" data-a="vote" data-k="${t}" ${v.result?'disabled':''}><span class="ic">${n.ic}</span><span><span class="nm">${name}</span>${mine===t?' <span class="chip relic">あなたの票</span>':''}<br><span class="small muted">${desc}</span>${who?`<span class="chips" style="margin-top:4px">${who}</span>`:''}</span></button>`;
  }).join('');
  let wheel='';
  if(v.result){
    const total=v.order.reduce((s,o)=>s+v.tally[o],0);let a=0;const stops=[];
    const legend=v.order.map(o=>{const span=360*v.tally[o]/total;stops.push(`${NODE_COLOR[o]} ${a}deg ${a+span}deg`);a+=span;return `<span class="chip" style="border-color:${NODE_COLOR[o]}"><i class="dot" style="background:${NODE_COLOR[o]}"></i>${NODES[o].n} ${v.tally[o]}票（${Math.round(100*v.tally[o]/total)}%）</span>`}).join('');
    const elapsed=(st.serverNow-v.at)+(Date.now()-NET.recvAt);
    const done=!v.spin||elapsed>=SPIN_MS;
    wheel=`<div class="panel roulette">
      <h3>${v.spin?(done?`${NODES[v.result].n}に決まった`:'ルーレットで決めています…'):`全員一致で${NODES[v.result].n}に決まった`}</h3>
      ${v.spin?`<div class="wheelbox"><span class="pointer" aria-hidden="true"></span><div id="wheel" class="wheel" style="background:conic-gradient(${stops.join(',')})" data-target="${v.target}" data-elapsed="${Math.round(elapsed)}"></div></div>`:''}
      <div class="chips" style="justify-content:center">${legend}</div></div>`;
  }
  return `${wheel}
  <h3>${v.result?'行き先':`行き先に投票する（${voted}/${live.length}人）`}</h3>
  <p class="small muted">${v.result?'':'全員が投票すると決まる。票が割れたら、票数に比例した確率のルーレットで決まる。決まるまでは投票し直せる。'}</p>
  <div class="opts">${opts}</div>`;
}
// ルーレットを回す（描画のたびに、経過時間に合わせて続きから回す）
function spinWheel(){
  const w=$app.querySelector('#wheel');if(!w)return;
  const target=Number(w.dataset.target),elapsed=Number(w.dataset.elapsed)+(Date.now()-NET.recvAt);
  const final=360*6-target;
  const remain=Math.max(0,SPIN_MS-elapsed);
  const start=remain<=0?final:final*Math.min(0.95,elapsed/SPIN_MS);
  w.style.transition='none';w.style.transform=`rotate(${start}deg)`;
  void w.offsetWidth;
  if(remain>0){w.style.transition=`transform ${remain}ms cubic-bezier(.15,.65,.12,1)`;w.style.transform=`rotate(${final}deg)`}
}
function onlineMapParty(){
  const st=NET.st;if(!st)return '';
  return `<div class="party">${st.players.filter(p=>p.inGame).map(p=>partyCard(p.id,{act:st.vote.votes[p.id]!==undefined,down:!p.online,line:`${CHARS[p.char]?CHARS[p.char].n:''}・HP ${p.id===NET.me?S.run.hp:p.hp}・${!p.online?'切断':st.vote.votes[p.id]!==undefined?'投票済み':'考え中'}`})).join('')}</div>`;
}
function onlineCombatBar(){
  const cs=NET.cs;if(!cs||!S.cb||cs.id!==S.cb.id)return '';
  const whose=cs.pl[cs.auth]?esc(cs.pl[cs.auth].nick):'？';
  const ban=cs.phase==='p'?(cs.auth===NET.me?'あなたの番':`${whose}の番`):cs.phase==='e'?'魔物の番':cs.phase==='win'?'勝利':'全滅';
  const list=cs.order.map(p=>{const P=cs.pl[p],on=present(p),st=[];if(P.block)st.push(`防御${P.block}`);if(P.poison)st.push(`毒${P.poison}`);if(P.weak)st.push(`弱体${P.weak}`);
    return `<div class="pm ${cs.phase==='p'&&cs.auth===p?'act':''} ${P.down||!on?'down':''}" data-pid="${esc(p)}"><b>${esc(P.nick)}</b>${p===NET.me?' <span class="muted">（あなた）</span>':''}<span class="bar"><span style="width:${Math.max(0,P.hp)/P.max*100}%"></span></span><span class="small muted num">${P.down?'戦闘不能':!on?'切断':`HP ${P.hp}/${P.max}`}${st.length?'・'+st.join(' '):''}</span></div>`}).join('');
  return `<div class="banner ${cs.phase==='p'&&cs.auth===NET.me?'mine':''}">${ban}</div><div class="party side-party">${list}</div>`;
}

// 行・列ボタンに触れると、詠唱の通り道（紋章で曲がる分も含む）を順番つきで光らせる
function clearPreview(){$app.querySelectorAll('.cell.pv').forEach(el=>{el.classList.remove('pv');delete el.dataset.step})}
function previewPath(btn){
  clearPreview();if(!btn||btn.disabled||S.screen!=='combat'||!S.cb)return;
  const c=S.cb;const path=castPath(btn.dataset.k,Number(btn.dataset.i),c.rev&&!c.revUsed);
  path.forEach((i,n)=>{const el=$app.querySelector(`.cell[data-i="${i}"]`);if(el){el.classList.add('pv');el.dataset.step=el.dataset.step?el.dataset.step+'・'+(n+1):String(n+1)}});
}
$app.addEventListener('pointerover',e=>{const b=e.target.closest('.line');if(b)previewPath(b)});
$app.addEventListener('pointerout',e=>{if(e.target.closest('.line'))clearPreview()});
$app.addEventListener('focusin',e=>{const b=e.target.closest('.line');if(b)previewPath(b)});
$app.addEventListener('focusout',e=>{if(e.target.closest('.line'))clearPreview()});

render();
</script>
